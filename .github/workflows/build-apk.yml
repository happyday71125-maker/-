name: Build Android APK 
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1
      - name: Upgrade v9.0 Engine
        run: |
          python3 -c 'exec("\n".join(x.strip() for x in r"""
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.isfile(kp): shutil.copy(kp, "app/fixed.keystore")
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw_kf = open(kf).read()
          p = raw_kf.split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "") if len(p) > 1 else ""
          kept = ((p[0] + "import android.app.*" + cand) if len(p) > 1 else raw_kf).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = re.sub(r"LlmInference\.createFromOptions\([^)]+\)", r"runCatching { \g<0> }.getOrNull()", t)
          t = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { appCtxRef = ctx.applicationContext; releaseGguf(); runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; gemmaName = \"미연결\"; embedName = \"미연결\"; var b = 0L; listOf(\"models\", \"llm_models\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \"🗑️ 로컬 GGUF · 임베딩 비우기 완료 (\" + (b/1048576L) + \"MB 확보)\" }\nfun startService(ctx: Context) = runCatching { appCtxRef = ctx.applicationContext;")
          t = t.replace("fun loadAiCfg(ctx: Context): AiRagConfig {", "fun loadAiCfg(ctx: Context): AiRagConfig {\nappCtxRef = ctx.applicationContext")
          t = t.replace("val uiScale: String = \"AUTO\")", "val uiScale: String = \"AUTO\", val apiUrl: String = \"local_gguf\", val apiModel: String = \"\", val apiKey: String = \"\", val temp: Float = 0.5f)")
          t = t.replace("p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\")", "p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\", p.getString(\"ai_host_url\", \"local_gguf\")?.ifBlank { \"local_gguf\" } ?: \"local_gguf\", p.getString(\"ai_host_model\", \"\") ?: \"\", p.getString(\"ai_host_key\", \"\") ?: \"\", p.getFloat(\"ai_temp\", 0.5f))")
          t = t.replace(".putString(\"ui_scale_mode\", c.uiScale).apply()", ".putString(\"ui_scale_mode\", c.uiScale).putString(\"ai_host_url\", c.apiUrl.trim()).putString(\"ai_host_model\", c.apiModel.trim()).putString(\"ai_host_key\", c.apiKey.trim()).putFloat(\"ai_temp\", c.temp).apply()")
          new_http = "\n".join(["var appCtxRef: Context? = null\nvar sharedAiChatIn by mutableStateOf(\"\")\nvar lastEngineUsed by mutableStateOf(\"🧠 로컬 GGUF\")\nvar ggufRunner: (suspend (String, String, Int) -> String)? = null\nvar ggufDropper: (suspend () -> Unit)? = null\nvar ggufLoadedPath: String = \"\"\nvar ggufLastStatus: String = \"대기중\"\nfun copyMemoToAi(txt: String) {\nval blk = txt.trim() + \"\\n────────────\\n\"\nsharedAiChatIn = if (sharedAiChatIn.isBlank()) blk else sharedAiChatIn.trimEnd() + \"\\n\" + blk\n}\nfun copyToClip(ctx: Context, txt: String) = runCatching {\n(ctx.getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager).setPrimaryClip(android.content.ClipData.newPlainText(\"memo\", txt))\n}\nfun makeHashtags(raw: String, cat: String): String {\nval ls = raw.trim().lines().dropLastWhile { ln -> ln.trim().let { it.isNotEmpty() && it.split(Regex(\"\\\\s+\")).all { w -> w.startsWith(\"#\") } } }\nval body = ls.joinToString(\"\\n\").trim()\nval stop = setOf(\"오늘\",\"내일\",\"지금\",\"그냥\",\"정말\",\"너무\",\"그리고\",\"하지만\",\"그래서\",\"위해\",\"대한\",\"통해\",\"관련\",\"하기\",\"있는\",\"없는\",\"입니다\",\"합니다\",\"완료\",\"정리\",\"메모\",\"할일\",\"일상\",\"항목\")\nval wds = body.replace(Regex(\"[^가-힣a-zA-Z0-9\\\\s]\"), \" \").split(Regex(\"\\\\s+\")).map {\nit.replace(Regex(\"(은|는|이|가|을|를|의|에|에서|으로|로|과|와|도|만|까지|부터|하고|하며|이라|이다|입니다|합니다|해서|해야|했던|하는)$\"), \"\")\n}.filter { it.length in 2..10 && !it.all { c -> c.isDigit() } && it !in stop }.distinct().take(5)\nval tags = (listOf(cat) + wds).map { \"#\" + it.replace(\"#\", \"\").trim() }.filter { it.length > 1 }.distinct().take(6).joinToString(\" \")","return if (body.isEmpty()) tags else \"$body\\n\\n$tags\"\n}\nfun isGgufFile(f: java.io.File): Boolean = f.isFile && f.length() > 1048576L && (f.name.endsWith(\".gguf\", true) || runCatching { val b = ByteArray(4); java.io.FileInputStream(f).use { it.read(b) == 4 && String(b, Charsets.US_ASCII) == \"GGUF\" } }.getOrDefault(false))\nfun findLocalGguf(): java.io.File? {\nval base = appCtxRef?.filesDir ?: java.io.File(\"/data/data/app.prolauncher.ai.v3/files\")\nfor (d in listOf(java.io.File(base, \"llm_models\"), java.io.File(base, \"models\"), base))\nd.listFiles()?.filter { isGgufFile(it) }?.maxByOrNull { it.lastModified() }?.let { return it }\n}\nreturn null\n}\nfun releaseGguf() {\nval d = ggufDropper; ggufRunner = null; ggufDropper = null; ggufLoadedPath = \"\"\nif (d != null) kotlinx.coroutines.runBlocking { runCatching { d.invoke() } }\n}\nfun cleanThink(s: String): String = s.replace(Regex(\"<think>[\\\\s\\\\S]*?</think>\"), \"\").trim().ifBlank { s.replace(\"<think>\", \"\").replace(\"</think>\", \"\").trim() }\nsuspend fun runLocalGguf(f: java.io.File, sysPrompt: String, history: List<ChatMsg>, userMsg: String): String? = runCatching {\nval path = f.absolutePath\nif (ggufRunner == null || ggufLoadedPath != path) {\nggufDropper?.invoke()\nrunCatching { AiResidentManager.gemmaLlm?.close(); AiResidentManager.gemmaLlm = null; AiResidentManager.gemmaBuf = null; if (AiResidentManager.embedder == null) AiResidentManager.embedBuf = null }\nSystem.gc()","val mdl = try { dev.ffmpegkit.llama.Llama.loadModel(modelPath = path, config = dev.ffmpegkit.llama.LlamaConfig(contextSize = 2048, threads = 4)) } catch (t1: Throwable) { dev.ffmpegkit.llama.Llama.loadModel(modelPath = path, config = dev.ffmpegkit.llama.LlamaConfig(contextSize = 1024, threads = 4)) }\nggufLoadedPath = path\nggufRunner = { p, s, mx -> dev.ffmpegkit.llama.Llama.complete(mdl, prompt = p, systemPrompt = s, maxTokens = mx).text }\nggufDropper = { runCatching { dev.ffmpegkit.llama.Llama.releaseModel(mdl) } }\n}\nval hist = history.takeLast(4).joinToString(\"\\n\") { (if (it.isUser) \"User: \" else \"AI: \") + it.text.take(140) }\nval fullS = (if (hist.isBlank()) sysPrompt else \"$sysPrompt\\n\\n[이전 대화]\\n$hist\") + \"\\n반드시 한국어로 핵심만 간결하게 답변하세요.\"\nval ans = cleanThink(ggufRunner?.invoke(userMsg, fullS, 512)?.trim() ?: \"\").takeIf { it.isNotBlank() }\nif (ans != null) { ggufLastStatus = \"정상\"; lastEngineUsed = \"🧠 로컬 GGUF (\" + f.name.take(14) + \")\" }\nans\n}.onFailure { e -> ggufLastStatus = (e.message ?: e.javaClass.simpleName).take(40); ggufRunner = null; ggufDropper = null; ggufLoadedPath = \"\" }.getOrNull()\nfun embedScore(q: String, doc: String): Float {\nAiResidentManager.embedder?.let { emb -> runCatching {\nval v1 = emb.embed(q).embeddingResult().embeddings().firstOrNull()?.floatEmbedding()\nval v2 = emb.embed(doc.take(300)).embeddingResult().embeddings().firstOrNull()?.floatEmbedding()\nif (v1 != null && v2 != null && v1.isNotEmpty() && v1.size == v2.size) {\nvar d = 0f; var n1 = 0f; var n2 = 0f","for (i in v1.indices) { d += v1[i] * v2[i]; n1 += v1[i] * v1[i]; n2 += v2[i] * v2[i] }\nval dn = kotlin.math.sqrt((n1 * n2).toDouble()).toFloat()\nif (dn > 1e-6f) return d / dn\n}\n} }\nval kws = q.replace(Regex(\"[^가-힣a-zA-Z0-9 ]\"), \" \").split(Regex(\"\\\\s+\")).filter { it.length >= 2 }\nreturn kws.count { k -> doc.contains(k, true) || KoreanChosungMatcher.matches(doc, k) }.toFloat() / kws.size.coerceAtLeast(1)\n}\nsuspend fun verifyLocalAiAndRag(aiCfg: AiRagConfig): String {\nval gf = findLocalGguf()\nval ragSt = if (aiCfg.ragOn) \"ON (\" + (if (aiCfg.ragScope == \"ALL\") \"전체메모\" else \"상위\" + aiCfg.ragTopK + \"건\") + \")\" else \"OFF (일반대화·메모미참조)\"\nval embSt = if (AiResidentManager.embedder != null) \"임베딩모델 활성\" else \"초성·키워드RAG 활성\"\nif (gf == null) return \"⚠️ 로컬 GGUF 미감지 (📂 로컬 AI 올리기 필요) | RAG: \" + ragSt + \" · \" + embSt\nval mb = gf.length() / 1048576L\nval r = runLocalGguf(gf, \"한국어로 짧게 인사하세요.\", emptyList(), \"안녕\")\nreturn if (!r.isNullOrBlank()) \"✅ 로컬 GGUF 정상 작동! [\" + gf.name.take(18) + \" · \" + mb + \"MB] (응답: \" + r.replace(\"\\n\", \" \").take(18) + \") | RAG: \" + ragSt + \" · \" + embSt\nelse \"⚠️ GGUF 점검 필요 (\" + ggufLastStatus + \") | RAG: \" + ragSt\n}\nfun parseAns(r: String): String? = r.trim().takeIf { it.isNotEmpty() && !it.startsWith(\"<!DOCTYPE\", true) && !it.startsWith(\"<html\", true) }?.let { s ->\nval raw = if (!s.startsWith(\"\\u007B\")) s else runCatching {\nval o = JSONObject(s); val c0 = o.optJSONArray(\"choices\")?.optJSONObject(0); val m0 = c0?.optJSONObject(\"message\")","(m0?.optString(\"content\")?.takeIf { it.isNotBlank() } ?: m0?.optString(\"reasoning_content\")?.takeIf { it.isNotBlank() } ?: c0?.optString(\"text\")?.takeIf { it.isNotBlank() } ?: o.optJSONArray(\"candidates\")?.optJSONObject(0)?.optJSONObject(\"content\")?.optJSONArray(\"parts\")?.optJSONObject(0)?.optString(\"text\")?.takeIf { it.isNotBlank() } ?: o.optJSONObject(\"message\")?.optString(\"content\")?.takeIf { it.isNotBlank() } ?: o.optString(\"response\").takeIf { it.isNotBlank() } ?: o.optString(\"content\").takeIf { it.isNotBlank() })?.trim()\n}.getOrNull()\nraw?.let { cleanThink(it) }?.takeIf { it.isNotBlank() }\n}\nfun postApi(u: String, k: String, body: JSONObject, tOut: Int = 25000): Pair<Int, String> {\nvar c: HttpURLConnection? = null\nreturn try {\nc = (URL(u).openConnection() as HttpURLConnection).apply { requestMethod = \"POST\"; connectTimeout = 4000; readTimeout = tOut; doOutput = true; setRequestProperty(\"Content-Type\", \"application/json; charset=UTF-8\"); setRequestProperty(\"User-Agent\", \"Mozilla/5.0\"); if (k.isNotBlank()) setRequestProperty(\"Authorization\", \"Bearer \" + k.trim()) }\nOutputStreamWriter(c.outputStream, Charsets.UTF_8).use { it.write(body.toString()) }\nval code = c.responseCode\ncode to ((if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: \"\")\n} catch (e: Exception) { -1 to \"\" } finally { c?.disconnect() }\n}\nfun getApi(u: String, k: String = \"\"): String = runCatching {","(URL(u).openConnection() as HttpURLConnection).apply { connectTimeout = 3000; readTimeout = 4000; setRequestProperty(\"User-Agent\", \"Mozilla/5.0\"); if (k.isNotBlank()) setRequestProperty(\"Authorization\", \"Bearer \" + k.trim()) }.inputStream.bufferedReader().use { it.readText() }\n}.getOrDefault(\"\")\nfun discoverServerModel(base: String, k: String): String {\nfor (ep in listOf(\"$base/api/tags\", \"$base/v1/models\")) {\nval s = getApi(ep, k); if (s.isNotEmpty()) runCatching {\nval j = JSONObject(s)\nj.optJSONArray(\"models\")?.optJSONObject(0)?.let { return it.optString(\"name\", it.optString(\"model\", \"\")).trim() }\nj.optJSONArray(\"data\")?.optJSONObject(0)?.optString(\"id\", \"\")?.trim()?.takeIf { it.isNotEmpty() }?.let { return it }\n}\n}\nreturn \"\"\n}\nfun fallbackLlmOrChat(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String): String {\nval fullSys = if (ragCtx.isBlank()) sysPrompt else \"$sysPrompt\\n\\n[참고 메모]\\n$ragCtx\"\nval msgs = JSONArray().apply {\nput(JSONObject().put(\"role\", \"system\").put(\"content\", fullSys))\nhistory.takeLast(4).forEach { m -> put(JSONObject().put(\"role\", if (m.isUser) \"user\" else \"assistant\").put(\"content\", m.text.take(200))) }\nput(JSONObject().put(\"role\", \"user\").put(\"content\", userMsg))\n}\nfor (ep in listOf(\"https\" + \"://text.pollinations.ai/openai\", \"https\" + \"://text.pollinations.ai/\")) {\nparseAns(postApi(ep, \"\", JSONObject().put(\"messages\", msgs).put(\"model\", \"openai\").put(\"seed\", 42), 14000).second)?.let { lastEngineUsed = \"🌐 온라인 AI\"; return it }\n}","lastEngineUsed = \"🤖 내장 오프라인 엔진\"\nval q = userMsg.trim()\nif (q.length <= 10 && (q.contains(\"안녕\") || q.contains(\"ㅎㅇ\") || q.contains(\"하이\") || q.contains(\"반가\") || q.contains(\"테스트\"))) {\nval gn = AiResidentManager.gemmaName.takeIf { !it.contains(\"미연결\") } ?: \"GGUF\"\nreturn \"안녕하세요! 🦙 로컬 AI ($gn) 챗봇입니다. 무엇이든 편하게 질문해 주세요!\"\n}\nval kw = q.replace(Regex(\"(이란|란|은|는|이|가|을|를|의|에|대해|알려줘|뭐야|어떤|나라야|[?？.!])+\"), \" \").trim().split(\" \").lastOrNull { it.length >= 2 } ?: q\nval r1 = getApi(\"https\" + \"://ko.wikipedia.org/api/rest_v1/page/summary/\" + URLEncoder.encode(kw.ifEmpty { q }, \"UTF-8\"))\nif (r1.isNotEmpty()) runCatching {\nval ex = JSONObject(r1).optString(\"extract\", \"\").trim()\nif (ex.isNotEmpty() && !ex.contains(\"자두야\") && !ex.contains(\"절망선생\")) return (if (ragCtx.isNotBlank()) \"📌 [메모 참조]\\n$ragCtx\\n\\n\" else \"\") + ex.take(700)\n}\nreturn if (ragCtx.isNotBlank()) \"📌 [내 메모 RAG 분석 결과]\\n$ragCtx\" else \"안녕하세요! [⚙️ AI 세팅]에서 로컬 AI (GGUF) 파일을 올려주시면 오프라인에서도 단독으로 답변합니다.\"\n}\nsuspend fun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String, apiUrl: String = \"\", apiModel: String = \"\", apiKey: String = \"\"): String? {\nval fullSys = if (ragCtx.isBlank()) sysPrompt else \"$sysPrompt\\n\\n[참고 메모]\\n$ragCtx\"\nval combP = if (fullSys.isNotBlank()) \"$fullSys\\n\\n질문: $userMsg\" else userMsg\nfindLocalGguf()?.let { gf -> runLocalGguf(gf, fullSys, history, userMsg)?.let { return it } }","AiResidentManager.gemmaLlm?.let { llm -> runCatching { llm.generateResponse(combP)?.trim()?.takeIf { it.isNotEmpty() } }?.getOrNull()?.let { lastEngineUsed = \"🧠 로컬 LiteRT\"; return cleanThink(it) } }\nvar rawU = apiUrl.trim(); val k = apiKey.trim(); val m = apiModel.trim()\nif (rawU.isBlank() || rawU == \"local_gguf\") return fallbackLlmOrChat(sysPrompt, ragCtx, history, userMsg)\nif (!rawU.startsWith(\"http\" + \"://\") && !rawU.startsWith(\"https\" + \"://\")) rawU = \"http\" + \"://$rawU\"\nval cleanU = rawU.removeSuffix(\"/\")\nval base = cleanU.removeSuffix(\"/v1/chat/completions\").removeSuffix(\"/chat/completions\").removeSuffix(\"/v1/completions\").removeSuffix(\"/completions\").removeSuffix(\"/completion\").removeSuffix(\"/api/chat\").removeSuffix(\"/api/generate\").removeSuffix(\"/v1\").removeSuffix(\"/\")\nval discMod = discoverServerModel(base, k)\nval mods = listOfNotNull(discMod.takeIf { it.isNotEmpty() }, m.takeIf { it.isNotEmpty() }, AiResidentManager.gemmaName.takeIf { it.isNotBlank() && !it.contains(\"미연결\") }, \"gemma3:1b\", \"\").distinct()\nfor (ep in linkedSetOf(\"$base/api/chat\", \"$base/v1/chat/completions\", cleanU)) {\nfor (mod in mods) {\nval b = JSONObject().apply { if (mod.isNotEmpty()) put(\"model\", mod); put(\"stream\", false); put(\"messages\", JSONArray().put(JSONObject().put(\"role\", \"system\").put(\"content\", fullSys)).put(JSONObject().put(\"role\", \"user\").put(\"content\", userMsg))) }\nval (c1, r1) = postApi(ep, k, b); parseAns(r1)?.let { lastEngineUsed = \"🦙 Ollama/API\"; return it }; if (c1 == -1) break\n}\n}","return fallbackLlmOrChat(sysPrompt, ragCtx, history, userMsg)\n}\nsuspend fun buildAiChatReply(\nqRaw: String, aiCfg: AiRagConfig, history: List<ChatMsg>,\nnotes: List<NoteItem>, books: List<BookItem>, cats: List<String>, ai: LocalAiNoteEngine\n): String = withContext(Dispatchers.IO) {\nval q = qRaw.trim()\nval useRag = aiCfg.ragOn\nval ragContext = if (useRag && notes.isNotEmpty()) {\nval baseNotes = if (aiCfg.ragImpOnly) notes.filter { SMC.isImportant(it) } else notes\nval ranked = baseNotes.sortedByDescending { n -> embedScore(q, n.content + \" \" + n.tags.joinToString(\" \")) + (if (SMC.isImportant(n)) 0.15f else 0f) }\nval targetNotes = if (aiCfg.ragScope == \"ALL\") ranked.take(12) else ranked.take(aiCfg.ragTopK.coerceAtLeast(1))\nbuildString {\nappend(\"총 메모 \" + notes.size + \"건 중 참조된 메모 (\" + targetNotes.size + \"건):\\n\")\ntargetNotes.forEachIndexed { idx, n ->\nval impStr = if (SMC.isImportant(n)) \"[★중요] \" else \"\"\nappend(\"\" + (idx + 1) + \". \" + impStr + \"[\" + SMC.categoryOf(n, cats) + \" · \" + n.createdAt + \"] \" + n.content.replace(\"\\n\", \" / \").take(220) + \"\\n\")\n}\nif (aiCfg.ragBooks && books.isNotEmpty()) {\nappend(\"\\n독서대 도서: \")\nbooks.take(3).forEach { b -> append(\"『\" + b.title + \"』(\" + b.category + \") \") }\n}\n}\n} else \"\"\ncallLlmHttp(aiCfg.sysPrompt, ragContext, history, q, aiCfg.apiUrl, aiCfg.apiModel, aiCfg.apiKey) ?: fallbackLlmOrChat(aiCfg.sysPrompt, ragContext, history, q)\n}"])
          idx_h = min(x for x in [t.find("fun parseAns("), t.find("fun cleanThink("), t.find("fun callLlmHttp(")] if x != -1)
