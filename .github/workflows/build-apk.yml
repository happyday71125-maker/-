name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: prolauncher-ai-permanent-keystore-v1 }
      - name: Upgrade v8.6
        run: |
          python3 -c 'exec("\n".join(x.strip() for x in r"""
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.isfile(kp): shutil.copy(kp, "app/fixed.keystore")
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw_kf = open(kf).read()
          p = raw_kf.split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "") if len(p) > 1 else ""
          kept = ((p[0] + "import android.app.*" + cand) if len(p) > 1 else raw_kf).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; embedName = \"미연결(기본임베딩)\"; var b = 0L; listOf(\"models\", \"llm_models\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \"🗑️ 임베딩 모델 해제 및 저장소 비우기 완료 (${b/1048576L}MB 확보)\" }\nfun startService(ctx: Context) = runCatching { if (true) return@runCatching;")
          t = t.replace("val uiScale: String = \"AUTO\")", "val uiScale: String = \"AUTO\", val apiUrl: String = \"\", val apiModel: String = \"\", val apiKey: String = \"\", val temp: Float = 0.5f)")
          t = t.replace("p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\")", "p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\", p.getString(\"ai_host_url\", \"\") ?: \"\", p.getString(\"ai_host_model\", \"\") ?: \"\", p.getString(\"ai_host_key\", \"\") ?: \"\", p.getFloat(\"ai_temp\", 0.5f))")
          t = t.replace(".putString(\"ui_scale_mode\", c.uiScale).apply()", ".putString(\"ui_scale_mode\", c.uiScale).putString(\"ai_host_url\", c.apiUrl.trim()).putString(\"ai_host_model\", c.apiModel.trim()).putString(\"ai_host_key\", c.apiKey.trim()).putFloat(\"ai_temp\", c.temp).apply()")
          new_http = "fun parseAns(r: String): String? = r.trim().takeIf { it.isNotEmpty() && !it.startsWith(\"<\") }?.let { s ->\nif (!s.startsWith(\"\\u007B\")) s else runCatching {\nval o = JSONObject(s)\nval c0 = o.optJSONArray(\"choices\")?.optJSONObject(0)\nval m0 = c0?.optJSONObject(\"message\")\n(m0?.optString(\"content\")?.takeIf { it.isNotBlank() }\n?: m0?.optString(\"reasoning_content\")?.takeIf { it.isNotBlank() }\n?: c0?.optString(\"text\")?.takeIf { it.isNotBlank() }\n?: o.optJSONArray(\"candidates\")?.optJSONObject(0)?.optJSONObject(\"content\")?.optJSONArray(\"parts\")?.optJSONObject(0)?.optString(\"text\")?.takeIf { it.isNotBlank() }\n?: o.optJSONObject(\"message\")?.optString(\"content\")?.takeIf { it.isNotBlank() }\n?: o.optString(\"response\").takeIf { it.isNotBlank() }\n?: o.optString(\"content\").takeIf { it.isNotBlank() }\n?: o.optString(\"reply\").takeIf { it.isNotBlank() }\n?: o.optString(\"text\").takeIf { it.isNotBlank() })?.trim()\n}.getOrNull()\n}\nfun postApi(u: String, k: String, body: JSONObject): Pair<Int, String> {\nvar c: HttpURLConnection? = null\nreturn try {\nc = (URL(u).openConnection() as HttpURLConnection).apply {\nrequestMethod = \"POST\"; connectTimeout = 15000; readTimeout = 90000; doOutput = true\nsetRequestProperty(\"Content-Type\", \"application/json; charset=UTF-8\")\nsetRequestProperty(\"Accept\", \"application/json\")\nif (k.isNotBlank()) setRequestProperty(\"Authorization\", \"Bearer ${k.trim()}\")\n}\nOutputStreamWriter(c.outputStream, Charsets.UTF_8).use { it.write(body.toString()) }\nval code = c.responseCode\nval s = (if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: \"\"\ncode to s\n} catch (e: Exception) { -1 to (e.message ?: \"연결 실패\") } finally { c?.disconnect() }\n}\nfun discoverServerModel(base: String, k: String): String {\nfor (ep in listOf(\"$base/v1/models\", \"$base/models\", \"$base/api/tags\")) {\nvar c: HttpURLConnection? = null\ntry {\nc = (URL(ep).openConnection() as HttpURLConnection).apply {\nrequestMethod = \"GET\"; connectTimeout = 4000; readTimeout = 5000\nif (k.isNotBlank()) setRequestProperty(\"Authorization\", \"Bearer ${k.trim()}\")\n}\nif (c.responseCode in 200..299) {\nval j = JSONObject(c.inputStream.bufferedReader().use { it.readText() })\nval d = j.optJSONArray(\"data\")\nif (d != null && d.length() > 0) {\nval id = d.getJSONObject(0).optString(\"id\", \"\").trim()\nif (id.isNotEmpty()) return id\n}\nval m = j.optJSONArray(\"models\")\nif (m != null && m.length() > 0) {\nval nm = m.getJSONObject(0).optString(\"name\", m.getJSONObject(0).optString(\"model\", \"\")).trim()\nif (nm.isNotEmpty()) return nm\n}\n}\n} catch (_: Exception) {} finally { c?.disconnect() }\n}\nreturn \"\"\n}\nfun wikiAns(userMsg: String, ragCtx: String): String {\nval q = userMsg.trim()\nval kw = q.replace(Regex(\"[^가-힣a-zA-Z0-9 ]\"), \" \").trim().split(Regex(\"\\\\s+\")).map { it.replace(Regex(\"(이란|란|은|는|이|가|을|를|의|에|대해|에서|무엇|뭔가요|알려줘|설명해줘|뭐야|어떤|나라야|나라)$\"), \"\") }.filter { it.length >= 2 }.lastOrNull() ?: q\nval sb = StringBuilder()\nif (ragCtx.isNotBlank()) sb.append(\"📌 [내 메모 검색 결과]\\n$ragCtx\\n\\n\")\nfor (lang in listOf(\"ko\", \"en\")) {\ntry {\nval enc = URLEncoder.encode(kw.ifEmpty { q }, \"UTF-8\")\nval u1 = \"https\" + \"://$lang.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&format=json&titles=$enc\"\nval c1 = (URL(u1).openConnection() as HttpURLConnection).apply { connectTimeout = 5000; readTimeout = 6000; setRequestProperty(\"User-Agent\", \"Mozilla/5.0\") }\nif (c1.responseCode in 200..299) {\nval pages = JSONObject(c1.inputStream.bufferedReader().use { it.readText() }).optJSONObject(\"query\")?.optJSONObject(\"pages\")\nif (pages != null) {\nval keys = pages.keys()\nwhile (keys.hasNext()) {\nval k = keys.next().toString()\nval pObj = pages.optJSONObject(k)\nval ext = pObj?.optString(\"extract\", \"\")?.trim() ?: \"\"\nif (ext.isNotEmpty()) { sb.append(ext.take(700)); return sb.toString() }\n}\n}\n}\nval u2 = \"https\" + \"://$lang.wikipedia.org/w/api.php?action=query&list=search&srsearch=$enc&format=json&srlimit=1\"\nval c2 = (URL(u2).openConnection() as HttpURLConnection).apply { connectTimeout = 5000; readTimeout = 6000; setRequestProperty(\"User-Agent\", \"Mozilla/5.0\") }\nif (c2.responseCode in 200..299) {\nval sr = JSONObject(c2.inputStream.bufferedReader().use { it.readText() }).optJSONObject(\"query\")?.optJSONArray(\"search\")\nif (sr != null && sr.length() > 0) {\nval title = sr.getJSONObject(0).optString(\"title\", \"\")\nval encT = URLEncoder.encode(title, \"UTF-8\")\nval u3 = \"https\" + \"://$lang.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&format=json&titles=$encT\"\nval c3 = (URL(u3).openConnection() as HttpURLConnection).apply { connectTimeout = 5000; readTimeout = 6000; setRequestProperty(\"User-Agent\", \"Mozilla/5.0\") }\nval pages3 = JSONObject(c3.inputStream.bufferedReader().use { it.readText() }).optJSONObject(\"query\")?.optJSONObject(\"pages\")\nif (pages3 != null) {\nval keys3 = pages3.keys()\nwhile (keys3.hasNext()) {\nval k3 = keys3.next().toString()\nval ext3 = pages3.optJSONObject(k3)?.optString(\"extract\", \"\")?.trim() ?: \"\"\nif (ext3.isNotEmpty()) { sb.append(ext3.take(700)); return sb.toString() }\n}\n}\n}\n}\n} catch (_: Exception) {}\n}\nreturn if (sb.isNotEmpty()) sb.toString() else \"⚠️ 답변을 불러오지 못했습니다. [⚙️ AI 설정]에서 API 호스팅 주소를 확인해 주세요.\"\n}\nfun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String, apiUrl: String = \"\", apiModel: String = \"\", apiKey: String = \"\"): String? {\nvar rawU = apiUrl.trim(); var k = apiKey.trim(); val m = apiModel.trim()\nif (rawU.startsWith(\"AIza\") || rawU.startsWith(\"gsk_\") || rawU.startsWith(\"sk-\")) {\nif (k.isBlank()) k = rawU\nrawU = if (rawU.startsWith(\"AIza\")) \"https\" + \"://generativelanguage.googleapis.com/v1beta/models\" else if (rawU.startsWith(\"gsk_\")) \"https\" + \"://api.groq.com/openai/v1/chat/completions\" else \"https\" + \"://api.openai.com/v1/chat/completions\"\n} else if (rawU.isBlank() && k.isNotBlank()) {\nrawU = if (k.startsWith(\"AIza\")) \"https\" + \"://generativelanguage.googleapis.com/v1beta/models\" else if (k.startsWith(\"gsk_\")) \"https\" + \"://api.groq.com/openai/v1/chat/completions\" else if (k.startsWith(\"sk-or-\")) \"https\" + \"://openrouter.ai/api/v1/chat/completions\" else \"https\" + \"://api.openai.com/v1/chat/completions\"\n}\nval fullSys = if (ragCtx.isBlank()) sysPrompt else \"$sysPrompt\\n\\n[참고 메모]\\n$ragCtx\"\nval combP = if (fullSys.isNotBlank()) \"$fullSys\\n\\n질문: $userMsg\" else userMsg\nif (rawU.isBlank() || rawU.contains(\"wikipedia.org\") || rawU.contains(\"duckduckgo.com\")) return wikiAns(userMsg, ragCtx)\nif (!rawU.startsWith(\"http\" + \"://\") && !rawU.startsWith(\"https\" + \"://\")) rawU = \"http\" + \"://$rawU\"\nval cleanU = rawU.removeSuffix(\"/\")\nif (cleanU.contains(\"generativelanguage.googleapis.com\")) {\nval gm = if (m.isBlank() || !m.startsWith(\"gemini\")) \"gemini-2.5-flash\" else m\nval gu = if (cleanU.contains(\":generateContent\")) (if (cleanU.contains(\"key=\")) cleanU else \"$cleanU?key=$k\") else \"$cleanU/$gm:generateContent?key=$k\"\nval b = JSONObject().put(\"contents\", JSONArray().put(JSONObject().put(\"parts\", JSONArray().put(JSONObject().put(\"text\", combP)))))\nval (code, resp) = postApi(gu, \"\", b)\nparseAns(resp)?.let { return it }\nreturn \"⚠️ Gemini API 오류 (HTTP $code): API 키와 모델명($gm)을 확인해 주세요.\"\n}\nval base = cleanU.removeSuffix(\"/v1/chat/completions\").removeSuffix(\"/chat/completions\").removeSuffix(\"/v1/completions\").removeSuffix(\"/completions\").removeSuffix(\"/completion\").removeSuffix(\"/api/chat\").removeSuffix(\"/api/generate\").removeSuffix(\"/v1\").removeSuffix(\"/\")\nval discMod = discoverServerModel(base, k)\nval mods = mutableListOf<String>()\nif (discMod.isNotEmpty()) mods.add(discMod)\nif (m.isNotEmpty() && !mods.contains(m)) mods.add(m)\nif (mods.isEmpty()) mods.add(\"default\")\nif (!mods.contains(\"\")) mods.add(\"\")\nval chatEps = linkedSetOf(\"$base/v1/chat/completions\", \"$base/api/chat\", cleanU)\nvar lastCode = 0; var lastErr = \"\"\nfor (ep in chatEps) {\nfor (mod in mods) {\nval b1 = JSONObject().apply {\nif (mod.isNotEmpty()) put(\"model\", mod)\nput(\"stream\", false)\nput(\"messages\", JSONArray().put(JSONObject().put(\"role\", \"user\").put(\"content\", combP)))\n}\nval (c1, r1) = postApi(ep, k, b1)\nparseAns(r1)?.let { return it }\nlastCode = c1; lastErr = r1\nif (c1 == -1) break\nval b2 = JSONObject().apply {\nif (mod.isNotEmpty()) put(\"model\", mod)\nput(\"stream\", false)\nput(\"messages\", JSONArray().put(JSONObject().put(\"role\", \"system\").put(\"content\", fullSys)).put(JSONObject().put(\"role\", \"user\").put(\"content\", userMsg)))\n}\nval (c2, r2) = postApi(ep, k, b2)\nparseAns(r2)?.let { return it }\nif (c2 != 404) { lastCode = c2; lastErr = r2 }\n}\n}\nfor (ep in listOf(\"$base/completion\", \"$base/v1/completions\", \"$base/api/generate\")) {\nval b3 = JSONObject().apply {\nval tm = if (discMod.isNotEmpty()) discMod else m\nif (tm.isNotEmpty()) put(\"model\", tm)\nput(\"prompt\", \"<start_of_turn>user\\n$combP<end_of_turn>\\n<start_of_turn>model\\n\")\nput(\"stream\", false)\nput(\"n_predict\", 512)\n}\nval (c3, r3) = postApi(ep, k, b3)\nparseAns(r3)?.let { return it }\nif (c3 == -1) break\nif (c3 != 404) { lastCode = c3; lastErr = r3 }\n}\nval errMsg = runCatching {\nval ej = JSONObject(lastErr)\nej.optJSONObject(\"error\")?.optString(\"message\")?.takeIf { it.isNotBlank() }\n?: ej.optString(\"error\").takeIf { it.isNotBlank() }\n?: ej.optString(\"message\").takeIf { it.isNotBlank() }\n}.getOrNull() ?: lastErr.replace(\"\\n\", \" \").take(100)\nreturn if (lastCode == -1) \"⚠️ API 서버($base)에 연결할 수 없습니다. Llama API 서버가 실행 중인지 확인해 주세요. ($errMsg)\"\nelse \"⚠️ API 호스팅 오류 (HTTP $lastCode${if (discMod.isNotEmpty()) \", 서버모델: $discMod\" else \"\"}): ${errMsg.ifBlank { \"서버 내부 오류 또는 모델 미로드\" }}\"\n}"
          idx_h = t.find("fun callLlmHttp(")
          idx_b = t.find("suspend fun buildAiChatReply(")
          t = t[:idx_h] + new_http + "\n\n" + t[idx_b:]
          t = t.replace("callLlmHttp(aiCfg.sysPrompt, ragContext, history, q)?.let { return@withContext \"☁️ [온라인 LLM 응답 (Gemma 3 1B 파일 미연결 상태)${if (useRag) \" + 임베딩젬마2 RAG\" else \"\"}]\\n$it\" }", "callLlmHttp(aiCfg.sysPrompt, ragContext, history, q, aiCfg.apiUrl, aiCfg.apiModel, aiCfg.apiKey)?.let { return@withContext it }")
          t = t.replace("callLlmHttp(aiCfg.sysPrompt, ragContext, history, q, aiCfg.apiUrl, aiCfg.apiModel)", "callLlmHttp(aiCfg.sysPrompt, ragContext, history, q, aiCfg.apiUrl, aiCfg.apiModel, aiCfg.apiKey)")
          t = re.sub(r"if \(!useRag\) return@withContext \"🔴.*", "if (!useRag) return@withContext wikiAns(q, ragContext)", t)
          new_panel = "Column(Modifier.verticalScroll(rememberScrollState()).padding(ui.cardPad), verticalArrangement = Arrangement.spacedBy(8.dp)) {\nText(\"🔎 1. 임베딩 모델 & 저장소 관리\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)\nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nChipBtn(\"📂 임베딩 모델 올리기\", AiResidentManager.embedder != null, CG) { onPickModel(\"EMBED\") }\nChipBtn(\"🗑️ 임베딩 모델 비우기\", false, Color(0xFFEF4444)) { testReport = AiResidentManager.clearStorage(ctx) }\n}\ntestReport?.let { rep ->\nSurface(color = Color(0xFF0A191E), shape = RoundedCornerShape(8.dp), border = BorderStroke(1.dp, CG.copy(alpha = 0.5f)), modifier = Modifier.fillMaxWidth()) {\nColumn(Modifier.padding(8.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {\nRow(Modifier.fillMaxWidth(), SB, CV) {\nText(\"📊 상태 안내\", fontSize = ui.subSp, fontWeight = FontWeight.Bold, color = CG)\nText(\"닫기 ✕\", fontSize = ui.subSp, color = Color.Gray, modifier = Modifier.clickable { testReport = null })\n}\nText(rep, fontSize = ui.subSp, color = CW)\n}\n}\n}\nColumn(verticalArrangement = Arrangement.spacedBy(6.dp)) {\nText(\"🌐 AI API 호스팅 설정 (프리셋 탭 또는 직접 입력)\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)\nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nChipBtn(\"🦙 로컬 Llama(11434)\", aiCfg.apiUrl.contains(\"11434\"), CG) { val u = aiCfg.copy(apiUrl = \"http\" + \"://127.0.0.1:11434\", apiModel = \"\"); onUpdate(u); saveAiCfg(ctx, u) }\nChipBtn(\"✨ Gemini(무료키)\", aiCfg.apiUrl.contains(\"googleapis\"), CA) { val u = aiCfg.copy(apiUrl = \"https\" + \"://generativelanguage.googleapis.com/v1beta/models\", apiModel = \"gemini-2.5-flash\"); onUpdate(u); saveAiCfg(ctx, u) }\nChipBtn(\"⚡ Groq\", aiCfg.apiUrl.contains(\"groq\"), CA) { val u = aiCfg.copy(apiUrl = \"https\" + \"://api.groq.com/openai/v1/chat/completions\", apiModel = \"llama-3.3-70b-versatile\"); onUpdate(u); saveAiCfg(ctx, u) }\nChipBtn(\"🌐 OpenRouter\", aiCfg.apiUrl.contains(\"openrouter\"), CA) { val u = aiCfg.copy(apiUrl = \"https\" + \"://openrouter.ai/api/v1/chat/completions\", apiModel = \"google/gemini-2.5-flash\"); onUpdate(u); saveAiCfg(ctx, u) }\nChipBtn(\"📚 기본지식(키없음)\", aiCfg.apiUrl.isBlank(), CG) { val u = aiCfg.copy(apiUrl = \"\", apiModel = \"\", apiKey = \"\"); onUpdate(u); saveAiCfg(ctx, u) }\n}\nOutlinedTextField(value = aiCfg.apiUrl, onValueChange = { val u = aiCfg.copy(apiUrl = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"API 호스팅 URL (예: http\" + \"://127.0.0.1:11434)\") }, singleLine = true, modifier = Modifier.fillMaxWidth())\nRow(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nOutlinedTextField(value = aiCfg.apiModel, onValueChange = { val u = aiCfg.copy(apiModel = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"모델명 (비워두면 자동감지)\") }, singleLine = true, modifier = Modifier.weight(1f))\nOutlinedTextField(value = aiCfg.apiKey, onValueChange = { val u = aiCfg.copy(apiKey = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"API Key (로컬은 비워둠)\") }, singleLine = true, modifier = Modifier.weight(1f))\n}\n}\nText(\"⚙️ 2. 프롬프트 & 프리셋"
          t = re.sub(r"Column\(Modifier\.verticalScroll\(rememberScrollState\(\)\)\.padding\(ui\.cardPad\).*?Text\(\"⚙️ (?:2\. )?기본 프롬프트 수정 & (?:프리셋|RAG 세부 설정)\"", new_panel, t, flags=re.S)
          open(kf, "w").write(t)
          mf = "app/src/main/AndroidManifest.xml"; m = open(mf).read()
          for pm in ["FOREGROUND_SERVICE", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"]: m = m if pm in m else m.replace("<application", f"<uses-permission android:name=\"android.permission.{pm}\" />\n<application", 1)
          if "largeHeap" not in m: m = m.replace("<application", "<application android:largeHeap=\"true\"", 1)
          if "usesCleartextTraffic" not in m: m = m.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
          if "AiResidentService" not in m: m = m.replace("</application>", "<service android:name=\".AiResidentService\" android:exported=\"false\" /></application>", 1)
          open(mf, "w").write(m.replace("singleTask", "singleTop"))
          gf = "app/build.gradle.kts"; g = open(gf).read().replace("0.10.14", "0.10.21").replace("0.10.22", "0.10.21")
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 3${{ g          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 3" + os.environ.get("G          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 3" + os.environ.get("GITHUB_RUN_NUMBER", "80") + "", g)
          if os.path.exists("app/fixed.keystore") and "fixed.keystore" not in g: g = g.replace("buildFeatures {", "signingConfigs { getByName(\"debug\") { storeFile = file(\"fixed.keystore\") } }\nbuildFeatures {", 1)
          open(gf, "w").write(g)
          sf = "app/src/main/java/app/prolauncher/ai/Screens.kt"; s = open(sf).read()
          s = s.replace("✨ AI 챗봇 (LLM & 전체 메모 RAG)", "✨ AI 챗봇").replace("✅ LLM 챗봇 + 전체 메모 RAG 엔진 활성", "🌐 API 호스팅 챗봇 · 임베딩 RAG").replace("⚙️ 프롬프트·RAG 설정", "⚙️ AI 설정").replace("⚙️ 카테고리·배율 설정", "⚙️ 메모 설정"); s = re.sub(r"ChipBtn\(\"💬 일반 AI 질문\".*?aiPromptCfgOpen = !aiPromptCfgOpen \}", "", s, flags=re.S)
          s = s.replace("val picker =", "val bkExp = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument(\"application/json\")) { u -> if (u != null) runCatching { val j = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).getString(\"notes_json\", \"[]\") ?: \"[]\"; ctx.contentResolver.openOutputStream(u)?.use { it.write(j.toByteArray()) }; aiMsg = \"💾 메모 파일 백업 완료 (${notes.size}건)\" } }\nval bkImp = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u -> if (u != null) runCatching { val j = ctx.contentResolver.openInputStream(u)?.bufferedReader()?.use { it.readText() } ?: \"\"; if (j.trim().startsWith(\"[\")) { val old = notes; ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).edit().putString(\"notes_json\", j).commit(); val merged = (repo.loadNotes() + old).distinctBy { it.id }; onSaveNotes(merged); aiMsg = \"♻️ 메모 복원 완료 (총 ${merged.size}건)\" } } }\nval picker =")
          s = s.replace("Text(\"3. 기능버튼 표시 설정\"", "Text(\"💾 메모 백업 & 복원\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG); Row(FMW.horizontalScroll(rememberScrollState()), horizontalArrangement = HS6) { ChipBtn(\"💾 파일 백업\", false, CG) { bkExp.launch(\"prolauncher_memos_backup.json\") }; ChipBtn(\"📂 파일 복원\", false, CA) { bkImp.launch(arrayOf(\"*/*\")) }; ChipBtn(\"⚡ 즉시 백업\", false, CG) { val j = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).getString(\"notes_json\", \"[]\") ?: \"[]\"; ctx.getSharedPreferences(\"pl_ai_v4_custom\", 0).edit().putString(\"memo_backup_json\", j).apply(); aiMsg = \"✅ 메모 ${notes.size}건 즉시 백업 완료!\" }; ChipBtn(\"♻️ 즉시 복원\", false, CA) { val j = ctx.getSharedPreferences(\"pl_ai_v4_custom\", 0).getString(\"memo_backup_json\", null); if (!j.isNullOrBlank()) { val old = notes; ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).edit().putString(\"notes_json\", j).commit(); val merged = (repo.loadNotes() + old).distinctBy { it.id }; onSaveNotes(merged); aiMsg = \"✅ 메모 ${merged.size}건 복원 완료!\" } } }; Text(\"3. 기능버튼 표시 설정\"")
          open(sf, "w").write(s)
          for fn in ["KoreanChosungMatcher.kt", "ModelBundleManager.kt", "Screens.kt"]: fp = "app/src/main/java/app/prolauncher/ai/" + fn; c = open(fp).read(); open(fp, "w").write(re.sub(r"ui\.(subSp|bodySp|titleSp)\s*\+\s*(\d+)\.sp", r"(ui.\g<1>.value + \g<2>).sp", c))
          """.splitlines()))'
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ProLauncherAI-debug-apk, path: "app/build/outputs/apk/debug/*.apk" }
