name: Build ProLauncherAI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Persist Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          python3 -c 'for s,d,m in [("MainActivity.kt","app/src/main/java/app/prolauncher/ai/MainActivity.kt","메모 · AI · 검색"),("ModelBundleManager.kt","app/src/main/java/app/prolauncher/ai/ModelBundleManager.kt","그래도 ${app.label} 열기"),("app/src/main/java/app/prolauncher/ai/Screens.kt","app/src/main/java/app/prolauncher/ai/Screens.kt","🔎 검색")]: t=open(s).read(); i=t.rfind(m); p=i+len(m); exec("while p>0 and t[:p].count(\"{\")>t[:p].count(\"}\"): p=t.find(\"}\",p)+1"); open(d,"w").write(t[:p]+"\n")'
          python3 -c 'sc="app/src/main/java/app/prolauncher/ai/Screens.kt"; st=open(sc).read(); m="app/src/main/java/app/prolauncher/ai/ModelBundleManager.kt"; mt=open(m).read(); open(sc,"w").write(st+"\n@Composable\nfun ChipBtn(text: String, sel: Boolean = false, col: Color = CG, onClick: () -> Unit) { Surface(color = if (sel) col else Color(0xFF1E2433), shape = RoundedCornerShape(10.dp), modifier = Modifier.clickable { onClick() }) { Text(text, fontSize = 11.sp, fontWeight = if (sel) FontWeight.Bold else FontWeight.Medium, color = if (sel) Color.Black else CW, modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)) } }\n") if "fun ChipBtn" not in st and "fun ChipBtn" not in mt else None'
          gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: "app/build/outputs/apk/debug/*.apk"
