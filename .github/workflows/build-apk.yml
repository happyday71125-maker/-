          gf = "app/build.gradle.kts"; g = open(gf).read()
          g = re.sub(r"tasks-genai:[0-9.]+", "tasks-genai:0.10.27", g)
          g = re.sub(r"tasks-text:[0-9.]+", "tasks-text:0.10.21", g)
          g = g.replace("compileSdk = 34", "compileSdk = 35")
          g = re.sub(r"versionCode\s*=\s*[^\n]+", "versionCode = 9" + os.environ.get("GITHUB_RUN_NUMBER", "95"), g)
          if "llama-android" not in g: g = g.replace("dependencies {", "dependencies {\nimplementation(\"dev.ffmpegkit-maintained:llama-android:0.1.1\")", 1)
          if os.path.exists("app/fixed.keystore") and "fixed.keystore" not in g: g = g.replace("buildFeatures {", "signingConfigs { getByName(\"debug\") { storeFile = file(\"fixed.keystore\") } }\nbuildFeatures {", 1)
          open(gf, "w").write(g)
          sf = "app/src/main/java/app/prolauncher/ai/Screens.kt"; s = re.sub(r"ui\.(subSp|bodySp|titleSp)\s*\+\s*(\d+)\.sp", r"(ui.\g<1>.value + \g<2>).sp", open(sf).read())
          s = s.replace("package app.prolauncher.ai", "package app.prolauncher.ai\nimport android.os.*\nimport android.speech.*\nimport android.speech.tts.*\nimport android.content.*")
          _b = []
          _b += ['var msgSeq = System.currentTimeMillis()', 'fun nextId(): Long { msgSeq += 1L; return msgSeq }', 'var vOn by mutableStateOf(false); var ttsOn by mutableStateOf(true); var vSt by mutableStateOf("대기중"); var topOpen by mutableStateOf(true); var btmOpen by mutableStateOf(true); var blkOn by mutableStateOf(false)']
          _b += ['var ttsI: TextToSpeech? = null; var ttsReady = false; val ttsPending = mutableListOf<String>()', 'var sttI: SpeechRecognizer? = null; var wlI: PowerManager.WakeLock? = null; var vCb: (String) -> Unit = {}', 'var isAiBusy by mutableStateOf(false); var streamActive by mutableStateOf(false); var waitRun = false']
