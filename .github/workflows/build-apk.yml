          _b += ['Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {', 'ChipBtn("📂 로컬 AI (.gguf/.litertlm) 올리기", AiResidentManager.gemmaMb > 0L, CG) { if (!busy) gemmaPicker.launch(arrayOf("*/*")) }']
          _b += ['ChipBtn("📂 임베딩 모델 올리기", AiResidentManager.embedMb > 0L, CG) { if (!busy) embedPicker.launch(arrayOf("*/*")) }', 'ChipBtn("🗑️ 모델/저장소 비우기", false, Color(0xFFEF4444)) { testReport = AiResidentManager.clearStorage(ctx) }', '}', 'testReport?.let { rep -> Text(rep, fontSize = ui.subSp, color = CG) }']
          _b += ['Text("🦙 2. 작동 모드 & 로컬 AI 이름 설정", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)', 'Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {']
          _b += ['ChipBtn("🧠 오프라인 단독 (GGUF·LiteRT)", aiCfg.apiUrl == "local_gguf" || aiCfg.apiUrl.isBlank(), CG) { val u = aiCfg.copy(apiUrl = "local_gguf"); onUpdate(u); saveAiCfg(ctx, u); testReport = "✅ 내장 GGUF / LiteRT-LM 오프라인 단독 모드 설정됨" }']
