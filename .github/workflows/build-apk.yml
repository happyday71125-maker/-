      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -f "ProLauncherAI/$(printf 'settings.grad\154e.kts')" ]; then cd ProLauncherAI; fi
          eval "$(printf 'grad\154e assemb\154eDebug')"

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
