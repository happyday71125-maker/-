name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Persistent Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1
      - name: Upgrade v9.4 Engine
        run: |
          python3 -c 'import sys; exec(sys.stdin.read())' << 'PYEOF'
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.isfile(kp): shutil.copy(kp, "app/fixed.keystore")
          lf = "app/src/main/java/app/prolauncher/ai/LocalAiNoteEngine.kt"; lt = open(lf).read()
          lt = re.sub(r"\.set(Temperature|TopK|TopP|RandomSeed)\([^)]*\)", "", lt)
          lt = lt.replace("TextEmbedder.createFromOptions(context, opts)", "(if (target.name.endsWith(\".tflite\", true) && mb < 80) runCatching { TextEmbedder.createFromOptions(context, opts) }.getOrNull() else null)")
          lt = lt.replace("LlmInference.createFromOptions(context, opts)", "(null as LlmInference?)").replace("modelLabel\n}", "refreshDetectedModelNames(); modelLabel\n}")
          open(lf, "w").write(lt)
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw_kf = open(kf).read()
          p = raw_kf.split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "") if len(p) > 1 else ""
          kept = ((p[0] + "import android.app.*" + cand) if len(p) > 1 else raw_kf).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = t.replace("package app.prolauncher.ai", "package app.prolauncher.ai\nimport com.google.mediapipe.tasks.genai.llminference.*\nimport com.google.mediapipe.tasks.genai.llminference.LlmInferenceSession.*")
          t = re.sub(r"\.set(Temperature|TopK|TopP|RandomSeed|ResultListener|ErrorListener)\([^)]*\)", "", t)
          t = re.sub(r"LlmInference\.createFromOptions\([^)]+\)", "(null as LlmInference?)", t)
          t = re.sub(r"TextEmbedder\.createFromOptions\([^)]+\)", r"runCatching { \g<0> }.getOrNull()", t)
          t = re.sub(r"\.channel\.map\(([^,]+),\s*0L?,\s*([^)]+)\)", r".channel.map(\1, 0L, minOf(33554432L, (\2).toLong()))", t)
          t = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { appCtxRef = ctx.applicationContext; releaseAllLocalModels(); runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; gemmaName = \"미연결\"; embedName = \"미연결\"; var b = 0L; listOf(\"models\", \"llm_models\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \"🗑️ 로컬 AI(.gguf/.litertlm) · 임베딩 비우기 완료 (\" + (b/1048576L) + \"MB 확보)\" }\nfun startService(ctx: Context) = runCatching { appCtxRef = ctx.applicationContext; if (true) return@runCatching Unit;")
          t = t.replace("fun loadAiCfg(ctx: Context): AiRagConfig {", "fun loadAiCfg(ctx: Context): AiRagConfig {\nappCtxRef = ctx.applicationContext; val sp0 = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0); thinkOn = sp0.getBoolean(\"ai_think_on\", false); streamOn = sp0.getBoolean(\"ai_stream_on\", true); refreshDetectedModelNames()")
          t = t.replace("val uiScale: String = \"AUTO\")", "val uiScale: String = \"AUTO\", val apiUrl: String = \"local_gguf\", val apiModel: String = \"\", val apiKey: String = \"\", val temp: Float = 0.5f)")
          t = t.replace("p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\")", "p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\", p.getString(\"ai_host_url\", \"local_gguf\")?.ifBlank { \"local_gguf\" } ?: \"local_gguf\", p.getString(\"ai_host_model\", \"\") ?: \"\", p.getString(\"ai_host_key\", \"\") ?: \"\", p.getFloat(\"ai_temp\", 0.5f))")
          t = t.replace(".putString(\"ui_scale_mode\", c.uiScale).apply()", ".putString(\"ui_scale_mode\", c.uiScale).putString(\"ai_host_url\", c.apiUrl.trim()).putString(\"ai_host_model\", c.apiModel.trim()).putString(\"ai_host_key\", c.apiKey.trim()).putFloat(\"ai_temp\", c.temp).apply()")
          t = re.sub(r"Column\(Modifier\.verticalScroll.*?Text\(\"⚙️ 2\. 기본 프롬프트 수정 & 프리셋\"", "Column(Modifier.verticalScroll(rememberScrollState()).padding(ui.cardPad), verticalArrangement = Arrangement.spacedBy(6.dp)) {\nText(\"🤖 1. 오프라인 단독 AI (.gguf / .litertlm) (\" + AiResidentManager.gemmaName.take(22) + \" / \" + AiResidentManager.embedName.take(16) + \")\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)\nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nChipBtn(\"📂 로컬 AI (.gguf/.litertlm) 올리기\", AiResidentManager.gemmaMb > 0L, CG) { if (!busy) gemmaPicker.launch(arrayOf(\"*/*\")) }\nChipBtn(\"📂 임베딩 모델 올리기\", AiResidentManager.embedMb > 0L, CG) { if (!busy) embedPicker.launch(arrayOf(\"*/*\")) }\nChipBtn(\"🗑️ 모델/저장소 비우기\", false, Color(0xFFEF4444)) { testReport = AiResidentManager.clearStorage(ctx) }\n}\ntestReport?.let { rep -> Text(rep, fontSize = ui.subSp, color = CG) }\nText(\"🦙 2. 작동 모드 & 로컬 AI 이름 설정\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)\nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nChipBtn(\"🧠 오프라인 단독 (GGUF·LiteRT)\", aiCfg.apiUrl == \"local_gguf\" || aiCfg.apiUrl.isBlank(), CG) { val u = aiCfg.copy(apiUrl = \"local_gguf\"); onUpdate(u); saveAiCfg(ctx, u); testReport = \"✅ 내장 GGUF / LiteRT-LM 오프라인 단독 모드 설정됨\" }\nChipBtn(\"🦙 외부 Ollama (11434)\", aiCfg.apiUrl.contains(\"11434\"), CA) { val u = aiCfg.copy(apiUrl = \"http\" + \"://127.0.0.1:11434\"); onUpdate(u); saveAiCfg(ctx, u); testReport = \"✅ 외부 Ollama(11434) 실시간 스트리밍 연동 설정됨\" }\n}\nOutlinedTextField(value = aiCfg.apiUrl, onValueChange = { val u = aiCfg.copy(apiUrl = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"모드/서버 주소 (local_gguf 또는 http\" + \"://127.0.0.1:11434)\") }, singleLine = true, modifier = Modifier.fillMaxWidth())\nRow(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nOutlinedTextField(value = aiCfg.apiModel, onValueChange = { val u = aiCfg.copy(apiModel = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"로컬 AI 이름 (예: 자비스)\") }, singleLine = true, modifier = Modifier.weight(1f))\nOutlinedTextField(value = aiCfg.apiKey, onValueChange = { val u = aiCfg.copy(apiKey = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"API Key (오프라인/올라마는 비워둠)\") }, singleLine = true, modifier = Modifier.weight(1f))\n}\nRow(Modifier.fillMaxWidth(), SB, CV) {\nText(\"⚙️ 3. 프롬프트 & 프리셋\"", t, flags=re.S)
          open(kf, "w").write(t)
          maf = "app/src/main/java/app/prolauncher/ai/MainActivity.kt"; ma = open(maf).read()
          ma = ma.replace("super.onCreate(savedInstanceState)", "super.onCreate(savedInstanceState); val prevEh = Thread.getDefaultUncaughtExceptionHandler(); Thread.setDefaultUncaughtExceptionHandler { th, ex -> if (th.name != \"main\") { ex.printStackTrace() } else { prevEh?.uncaughtException(th, ex) } }")
          ma = ma.replace("pageCount = { 3 }", "pageCount = { 4 }")
          ma = ma.replace("onSaveNotes = { notes = it; repo.saveNotes(it) }, onSaveTodos = { todos = it; repo.saveTodos(it) })", "onSaveNotes = { notes = it; repo.saveNotes(it) }, onSaveTodos = { todos = it; repo.saveTodos(it) }, isAiPage = false)\n3 -> NotesRagView(notes, todos, books, cfg, ai, null, onClearQuote = {}, onSaveNotes = { notes = it; repo.saveNotes(it) }, onSaveTodos = { todos = it; repo.saveTodos(it) }, isAiPage = true)")
          ma = ma.replace("메모 · AI · 검색 →", "메모장 →  |  AI·세팅(2번) →→")
          open(maf, "w").write(ma)
          mf = "app/src/main/AndroidManifest.xml"; m = open(mf).read()
          for pm in ["FOREGROUND_SERVICE", "FOREGROUND_SERVICE_DATA_SYNC", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "RECORD_AUDIO"]: m = m if f".{pm}\"" in m else m.replace("<application", f"<uses-permission android:name=\"android.permission.{pm}\" />\n<application", 1)
          if "largeHeap" not in m: m = m.replace("<application", "<application android:largeHeap=\"true\"", 1)
          if "usesCleartextTraffic" not in m: m = m.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
          if "libOpenCL.so" not in m: m = m.replace("</application>", "<uses-native-library android:name=\"libvndksupport.so\" android:required=\"false\" /><uses-native-library android:name=\"libOpenCL.so\" android:required=\"false\" /></application>", 1)
          if "AiResidentService" not in m: m = m.replace("</application>", "<service android:name=\".AiResidentService\" android:exported=\"false\" android:foregroundServiceType=\"dataSync\" /></application>", 1)
          else: m = m.replace("android:name=\".AiResidentService\" android:exported=\"false\"", "android:name=\".AiResidentService\" android:exported=\"false\" android:foregroundServiceType=\"dataSync\"")
          open(mf, "w").write(m.replace("singleTask", "singleTop"))
          gf = "app/build.gradle.kts"; g = open(gf).read()
          g = re.sub(r"tasks-genai:[0-9.]+", "tasks-genai:0.10.27", g)
          g = re.sub(r"tasks-text:[0-9.]+", "tasks-text:0.10.21", g)
          g = g.replace("compileSdk = 34", "compileSdk = 35")
          g = re.sub(r"versionCode\s*=\s*[^\n]+", "versionCode = 9" + os.environ.get("GITHUB_RUN_NUMBER", "95"), g)
          if "llama-android" not in g: g = g.replace("dependencies {", "dependencies {\nimplementation(\"dev.ffmpegkit-maintained:llama-android:0.1.1\")", 1)
          if os.path.exists("app/fixed.keystore") and "fixed.keystore" not in g: g = g.replace("buildFeatures {", "signingConfigs { getByName(\"debug\") { storeFile = file(\"fixed.keystore\") } }\nbuildFeatures {", 1)
          open(gf, "w").write(g)
          sf = "app/src/main/java/app/prolauncher/ai/Screens.kt"; s = re.sub(r"ui\.(subSp|bodySp|titleSp)\s*\+\s*(\d+)\.sp", r"(ui.\g<1>.value + \g<2>).sp", open(sf).read())
          s = s.replace("package app.prolauncher.ai", "package app.prolauncher.ai\nimport android.os.*\nimport android.speech.*\nimport android.speech.tts.*\nimport android.content.*")
          v_blk = 'var msgSeq = System.currentTimeMillis()\nfun nextId(): Long { msgSeq += 1L; return msgSeq }\nvar vOn by mutableStateOf(false); var ttsOn by mutableStateOf(true); var vSt by mutableStateOf("대기중"); var topOpen by mutableStateOf(true); var btmOpen by mutableStateOf(true); var blkOn by mutableStateOf(false)\nvar ttsI: TextToSpeech? = null; var ttsReady = false; val ttsPending = mutableListOf<String>()\nvar sttI: SpeechRecognizer? = null; var wlI: PowerManager.WakeLock? = null; var vCb: (String) -> Unit = {}\nvar isAiBusy by mutableStateOf(false); var streamActive by mutableStateOf(false); var waitRun = false\nvar ttsSpkIdx = 0; var ttsFirstChunk = true\nvar lastEcho by mutableStateOf(""); var pauseUntil by mutableStateOf(0L)\nvar vBuf by mutableStateOf(""); var vSeq = 0; var vSpkNow = false; var vWaitSec by mutableStateOf(3)\n\nfun uiP(d: Long = 0L, f: () -> Unit) { Handler(Looper.getMainLooper()).postDelayed(Runnable { f() }, d) }\nfun keepAw(ctx: Context, on: Boolean) = runCatching {\nif (on) {\nif (wlI == null) wlI = (ctx.getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "PL:V")\nif (wlI?.isHeld == false) wlI?.acquire(14400000L)\nAiResidentManager.startService(ctx)\n} else if (wlI?.isHeld == true) wlI?.release()\nUnit\n}\nfun flushV(ctx: Context) {\nval msg = vBuf.trim(); vBuf = ""; vSpkNow = false; vSeq++\nif (msg.isNotEmpty() && !isAiBusy && !streamActive && ttsI?.isSpeaking != true) {\nrunCatching { sttI?.cancel() }; isAiBusy = true; vSt = "🧠 " + msg.take(12); vCb(msg)\n}\n}\nfun schedV(ctx: Context, ex: Long = 0L) {\nval tk = ++vSeq; val d = (vWaitSec * 1000L + ex).coerceAtLeast(1200L)\nuiP(d) {\nif (tk == vSeq && vOn && !isAiBusy && !streamActive && ttsI?.isSpeaking != true) {\nif (vSpkNow) schedV(ctx, 1200L) else if (vBuf.isNotBlank()) flushV(ctx)\n}\n}\n}\nfun sttGo(ctx: Context): Unit = uiP {\nif (!vOn || isAiBusy || streamActive || ttsI?.isSpeaking == true) return@uiP\nif (System.currentTimeMillis() < pauseUntil) { uiP(500) { sttGo(ctx) }; return@uiP }\nrunCatching {\nif (sttI == null) sttI = SpeechRecognizer.createSpeechRecognizer(ctx.applicationContext)\nsttI?.setRecognitionListener(object : RecognitionListener {\noverride fun onReadyForSpeech(p: Bundle?) { if (!isAiBusy && !streamActive && ttsI?.isSpeaking != true) vSt = if (vBuf.isBlank()) "🎙️ 듣는중" else "✍️ 이어듣기(" + vWaitSec + "초)" }\noverride fun onBeginningOfSpeech() { vSpkNow = true; vSeq++ }\noverride fun onRmsChanged(v: Float) {}\noverride fun onBufferReceived(b: ByteArray?) {}\noverride fun onEndOfSpeech() { vSpkNow = false }\noverride fun onPartialResults(b: Bundle?) {\nval pt = b?.getStringArrayList("results_recognition")?.firstOrNull()?.trim() ?: ""\nif (pt.isNotEmpty() && !isAiBusy && !streamActive && ttsI?.isSpeaking != true) { vSpkNow = true; vSeq++; sharedAiChatIn = if (vBuf.isBlank()) pt else vBuf + " " + pt; vSt = "🗣️ " + pt.take(12) }\n}\noverride fun onEvent(t: Int, p: Bundle?) {}\noverride fun onError(e: Int) {\nval had = vSpkNow; vSpkNow = false\nif (e == SpeechRecognizer.ERROR_CLIENT || e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) { runCatching { sttI?.destroy() }; sttI = null }\nif (vOn && !isAiBusy && !streamActive && ttsI?.isSpeaking != true) { if (had && vBuf.isNotBlank()) schedV(ctx, -800L); uiP(500) { sttGo(ctx) } }\n}\noverride fun onResults(b: Bundle?) {\nvSpkNow = false\nif (!vOn || isAiBusy || streamActive || ttsI?.isSpeaking == true) return\nval raw = b?.getStringArrayList("results_recognition")?.firstOrNull()?.trim() ?: ""\nif (raw.isEmpty()) { if (vOn) uiP(350) { sttGo(ctx) }; return }\nval q = raw.replace(Regex("^[.,~!? ]+"), "").trim()\nif (lastEcho.isNotEmpty() && (q == lastEcho || (q.length >= 4 && lastEcho.contains(q)))) { vSt = "👂 에코 무시"; uiP(450) { sttGo(ctx) }; return }\nif (vBuf.isBlank() && q in listOf("잠깐", "잠시만", "잠시", "기다려", "잠깐만", "대기", "타임", "스톱", "조용")) { pauseUntil = System.currentTimeMillis() + 5000L; vSt = "⏸️ 잠시 대기중"; uiP(1500) { if (vOn) sttGo