name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1
      - name: Upgrade v8.7
        run: |
          python3 -c 'exec("\n".join(x.strip() for x in r"""
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.isfile(kp): shutil.copy(kp, "app/fixed.keystore")
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw_kf = open(kf).read()
          p = raw_kf.split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "") if len(p) > 1 else ""
          kept = ((p[0] + "import android.app.*" + cand) if len(p) > 1 else raw_kf).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = re.sub(r"LlmInference\.createFromOptions\([^)]+\)", r"runCatching { \g<0> }.getOrNull()", t)
          t = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; gemmaName = \"미연결\"; embedName = \"미연결\"; var b = 0L; listOf(\"models\", \"llm_models\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \"🗑️ 로컬 GGUF · 임베딩 해제 및 비우기 완료 (\" + (b/1048576L) + \"MB 확보)\" }\nfun startService(ctx: Context) = runCatching {")
          t = t.replace("val uiScale: String = \"AUTO\")", "val uiScale: String = \"AUTO\", val apiUrl: String = \"http\" + \"://127.0.0.1:11434\", val apiModel: String = \"\", val apiKey: String = \"\", val temp: Float = 0.5f)")
          t = t.replace("p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\")", "p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\", p.getString(\"ai_host_url\", \"http\" + \"://127.0.0.1:11434\") ?: (\"http\" + \"://127.0.0.1:11434\"), p.getString(\"ai_host_model\", \"\") ?: \"\", p.getString(\"ai_host_key\", \"\") ?: \"\", p.getFloat(\"ai_temp\", 0.5f))")
          t = t.replace(".putString(\"ui_scale_mode\", c.uiScale).apply()", ".putString(\"ui_scale_mode\", c.uiScale).putString(\"ai_host_url\", c.apiUrl.trim()).putString(\"ai_host_model\", c.apiModel.trim()).putString(\"ai_host_key\", c.apiKey.trim()).putFloat(\"ai_temp\", c.temp).apply()")
          new_http = "\n".join([
          "fun parseAns(r: String): String? = r.trim().takeIf { it.isNotEmpty() && !it.startsWith(\"<\") }?.let { s ->\nif (!s.startsWith(\"\\u007B\")) s else runCatching {\nval o = JSONObject(s); val c0 = o.optJSONArray(\"choices\")?.optJSONObject(0); val m0 = c0?.optJSONObject(\"message\")",
          "(m0?.optString(\"content\")?.takeIf { it.isNotBlank() } ?: m0?.optString(\"reasoning_content\")?.takeIf { it.isNotBlank() } ?: c0?.optString(\"text\")?.takeIf { it.isNotBlank() } ?: o.optJSONArray(\"candidates\")?.optJSONObject(0)?.optJSONObject(\"content\")?.optJSONArray(\"parts\")?.optJSONObject(0)?.optString(\"text\")?.takeIf { it.isNotBlank() } ?: o.optJSONObject(\"message\")?.optString(\"content\")?.takeIf { it.isNotBlank() } ?: o.optString(\"response\").takeIf { it.isNotBlank() } ?: o.optString(\"content\").takeIf { it.isNotBlank() })?.trim()\n}.getOrNull()\n}\nfun postApi(u: String, k: String, body: JSONObject): Pair<Int, String> {\nvar c: HttpURLConnection? = null",
