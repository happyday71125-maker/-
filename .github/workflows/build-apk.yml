name: Build ProLauncherAI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Persist Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          python3 -c 'for s,d,m in [("MainActivity.kt","app/src/main/java/app/prolauncher/ai/MainActivity.kt","메모 · AI · 검색"),("app/src/main/java/app/prolauncher/ai/ModelBundleManager.kt","app/src/main/java/app/prolauncher/ai/ModelBundleManager.kt","닫고 집중 유지하기"),("app/src/main/java/app/prolauncher/ai/Screens.kt","app/src/main/java/app/prolauncher/ai/Screens.kt","🔎 검색")]: t=open(s).read(); t=t[t.rfind("package app.prolauncher.ai"):] if "package app.prolauncher.ai" in t else t; i=t.rfind(m); p=i+len(m); exec("while i!=-1 and p>0 and t[:p].count(\"{\")>t[:p].count(\"}\"): p=t.find(\"}\",p)+1"); open(d,"w").write(t[:p]+"\n") if i!=-1 else None'
          gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: "app/build/outputs/apk/debug/*.apk"
