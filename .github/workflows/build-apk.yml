          _b += ['Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {', 'OutlinedTextField(value = aiCfg.apiModel, onValueChange = { val u = aiCfg.copy(apiModel = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text("로컬 AI 이름 (예: 자비스)") }, singleLine = true, modifier = Modifier.weight(1f))']
          _b += ['OutlinedTextField(value = aiCfg.apiKey, onValueChange = { val u = aiCfg.copy(apiKey = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text("API Key (오프라인/올라마는 비워둠)") }, singleLine = true, modifier = Modifier.weight(1f))', '}', 'Row(Modifier.fillMaxWidth(), SB, CV) {', 'Text("⚙️ 3. 프롬프트 & 프리셋"']
          panel_ui = chr(10).join(_b)
