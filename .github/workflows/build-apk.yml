name: Build Android APK
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Persistent Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1

      - name: Prepare Persistent Keystore
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp ~/.android/debug.keystore app/fixed.keystore

      - name: Cache ProLlama JNI
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: prollama-jni-arm64-v96-r1
          restore-keys: |
            prollama-jni-arm64-

      - name: Build ProLlama C++ JNI if not cached
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libprollama_jni.so ]; then
            P="ht""tps"
            git clone --depth 1 "${P}://github.com/ggerganov/llama.cpp.git" app/src/main/cpp/llama.cpp
            cmake -S app/src/main/cpp -B /tmp/build_jni -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF
            cmake --build /tmp/build_jni --target prollama_jni -j4
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp /tmp/build_jni/libprollama_jni.so app/src/main/jniLibs/arm64-v8a/
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
