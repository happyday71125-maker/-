name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Permanent Debug Keystore (No Conflict on Update)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1

      - name: Prepare Fixed Signing Key & Clean Sources
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -noprompt -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" < /dev/null
          fi
          cp ~/.android/debug.keystore app/fixed.keystore
          sed -i -E 's/ui\.(subSp|bodySp|titleSp) \+ ([0-9]+)\.sp/(ui.\1.value + \2).sp/g' app/src/main/java/app/prolauncher/ai/*.kt
          python3 -c '
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          s = open(kf, encoding="utf-8").read()
          if s.count("package app.prolauncher.ai") > 1:
              s = "package app.prolauncher.ai" + s.split("package app.prolauncher.ai")[1]
          s = s.replace(".setPreferredBackend(LlmInference.Backend.GPU)", "")
          s = s.replace(".setPreferredBackend(LlmInference.Backend.CPU)", "")
          open(kf, "w", encoding="utf-8").write(s)
          '

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
