name: Build ProLauncherAI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Persist Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            app/fixed.keystore
          key: prolauncher-ai-permanent-keystore-v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          mkdir -p ~/.android
          if [ -f ~/.android/debug.keystore ] && [ ! -f app/fixed.keystore ]; then cp -f ~/.android/debug.keystore app/fixed.keystore; fi
          if [ ! -f app/fixed.keystore ]; then keytool -genkeypair -v -keystore app/fixed.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
          cp -f app/fixed.keystore ~/.android/debug.keystore
          python3 -c 'import re; f="app/build.gradle.kts"; s=open(f).read(); s=re.sub(r"versionCode\s*=\s*\d+", "versionCode = 1${{ github.run_number }}", s); s=re.sub(r"versionName\s*=\s*\"[^\"]+\"", "versionName = \"6.0.${{ github.run_number }}\"", s); s=s.replace("defaultConfig {", "signingConfigs { getByName(\"debug\") { storeFile = file(\"fixed.keystore\"); storePassword = \"android\"; keyAlias = \"androiddebugkey\"; keyPassword = \"android\" } }\nbuildTypes { getByName(\"debug\") { signingConfig = signingConfigs.getByName(\"debug\") } }\ndefaultConfig {") if "signingConfigs" not in s else s; open(f,"w").write(s)'
          python3 -c 'mf="app/src/main/AndroidManifest.xml"; ms=open(mf).read(); ms=ms.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\" />\n<application android:usesCleartextTraffic=\"true\"") if "android.permission.INTERNET" not in ms else ms; open(mf,"w").write(ms)'
          python3 -c 'for s,d,m in [("MainActivity.kt","app/src/main/java/app/prolauncher/ai/MainActivity.kt","메모 · AI · 검색"),("app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt","app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt","onPickModel()"),("app/src/main/java/app/prolauncher/ai/ModelBundleManager.kt","app/src/main/java/app/prolauncher/ai/ModelBundleManager.kt","닫고 집중 유지하기"),("app/src/main/java/app/prolauncher/ai/Screens.kt","app/src/main/java/app/prolauncher/ai/Screens.kt","🔎 검색")]: t=open(s).read(); t=t[t.rfind("package app.prolauncher.ai"):] if "package app.prolauncher.ai" in t else t; i=t.rfind(m); p=i+len(m); exec("while i!=-1 and p>0 and t[:p].count(\"{\")>t[:p].count(\"}\"): p=t.find(\"}\",p)+1"); open(d,"w").write(t[:p]+"\n") if i!=-1 else None'
          gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: "app/build/outputs/apk/debug/*.apk"
