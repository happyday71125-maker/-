name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Persistent Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1
      - name: Upgrade v9.5 GGUF Core
        run: |
          python3 -c 'import sys; exec(sys.stdin.read())' << 'PYEOF'
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.isfile(kp): shutil.copy(kp, "app/fixed.keystore")
          _b = []
          _b += ['class LlmInference : AutoCloseable {', 'enum class Backend { CPU, GPU }', 'class LlmInferenceOptions {', 'class Builder {', 'fun setModelPath(p: String) = this', 'fun setMaxTokens(n: Int) = this', 'fun setMaxTopK(n: Int) = this', 'fun setPreferredBackend(b: Backend) = this', 'fun setResultListener(l: (String, Boolean) -> Unit) = this']
          _b += ['fun setErrorListener(l: (RuntimeException) -> Unit) = this', 'fun build() = LlmInferenceOptions()', '}', 'companion object { fun builder() = Builder() }', '}', 'fun generateResponse(p: String): String = ""', 'override fun close() {}', 'companion object { fun createFromOptions(c: android.content.Context, o: LlmInferenceOptions): LlmInference? = null }', '}']
          llm_shim = chr(10).join(_b)
          _b = []
          _b += ['suspend fun loadModelUri(uri: Uri): Result<String> = withContext(Dispatchers.IO) {', 'runCatching {', 'var name = "model.gguf"', 'context.contentResolver.query(uri, null, null, null, null)?.use { c ->', 'val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)', 'if (idx >= 0 && c.moveToFirst()) name = c.getString(idx)', '}', 'val isEmb = isEmbedModelName(name)']
          _b += ['val msg = importGgufModelUri(context, uri, isEmb)', 'if (msg.startsWith("⚠️")) throw IllegalArgumentException(msg)', 'modelLabel = msg', 'msg', '}', '}']
          load_uri_fn = chr(10).join(_b)
          lf = "app/src/main/java/app/prolauncher/ai/LocalAiNoteEngine.kt"; lt = open(lf).read()
          lt = re.sub(r"import com\.google\.mediapipe\.tasks\.genai[^\n]*\n?", "", lt)
          lt = lt.replace("package app.prolauncher.ai", "package app.prolauncher.ai\n" + llm_shim, 1)
          lt = re.sub(r"\.set(Temperature|TopK|TopP|RandomSeed)\([^)]*\)", "", lt)
          lt = re.sub(r"LlmInference\.createFromOptions\([^)]+\)", "(null as LlmInference?)", lt)
          lt = re.sub(r"suspend fun loadModelUri\(uri: Uri\): Result<String>.*?(?=(?:private )?fun (?:embedVec|categoryIcon)\()", lambda _: load_uri_fn + "\n\n", lt, count=1, flags=re.S)
          lt = lt.replace("val qVec = embed(q)", "val qVec = embedWithGguf(q, true) ?: embed(q)")
          lt = lt.replace('val qv = embedVec("task: search result | query: $q")', 'val qv = embedWithGguf(q, true) ?: embedVec("task: search result | query: $q")')
          lt = lt.replace("cosSim(qv, embedVec(n.content))", 'cosSim(qv, embedWithGguf(n.content, false, "메모") ?: embedVec(n.content))')
          lt = lt.replace("cosSim(qv, embedVec(p))", "cosSim(qv, embedWithGguf(p, false, b.title) ?: embedVec(p))")
          lt = lt.replace('cosine(qVec, embed("${n.category} ${n.content} ${n.summary} ${n.tags.joinToString(" ")}"))', 'cosine(qVec, embedWithGguf(n.content, false, n.category) ?: embed("${n.category} ${n.content} ${n.summary} ${n.tags.joinToString(" ")}"))')
          lt = lt.replace('cosine(qVec, embed("${b.title} ${b.category} $p"))', 'cosine(qVec, embedWithGguf(p, false, b.title) ?: embed("${b.title} ${b.category} $p"))')
          open(lf, "w").write(lt)
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw_kf = open(kf).read()
          p = raw_kf.split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "") if len(p) > 1 else ""
          kept = ((p[0] + "import android.app.*" + cand) if len(p) > 1 else raw_kf).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = re.sub(r"import com\.google\.mediapipe\.tasks\.genai[^\n]*\n?", "", t)
          t = re.sub(r"\.set(Temperature|TopK|TopP|RandomSeed)\([^)]*\)", "", t)
          t = re.sub(r"LlmInference\.createFromOptions\([^)]+\)", "(null as LlmInference?)", t)
          t = re.sub(r"\.channel\.map\(([^,]+),\s*0L?,\s*([^)]+)\)", r".channel.map(\1, 0L, minOf(33554432L, (\2).toLong()))", t)
          _z = ''
          _z += 't = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { appCtxRef = ctx.applicationContext; releaseAllLocalModels(); runCatching { gemmaLlm?.close(); '
          _z += 'embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; gemmaName = \\"미연결\\"; embedName = \\"미연결\\"; var b = 0L; listOf(\\"models\\", \\"llm_mode'
          _z += 'ls\\", \\"embed_models\\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \\"🗑️ GGUF '
          _z += '채팅 · 임베딩젬마2 모델 비우기 완료 (\\" + (b/1048576L) + \\"MB 확보)\\" }\\nfun startService(ctx: Context) = runCatching { appCtxRef = ctx.applicationContext; if (true) return@runCatching Unit;")'
          exec(_z)
          t = t.replace("fun loadAiCfg(ctx: Context): AiRagConfig {", "fun loadAiCfg(ctx: Context): AiRagConfig {\nappCtxRef = ctx.applicationContext; val sp0 = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0); thinkOn = sp0.getBoolean(\"ai_think_on\", false); streamOn = sp0.getBoolean(\"ai_stream_on\", true); refreshDetectedModelNames()")
          t = t.replace("val uiScale: String = \"AUTO\")", "val uiScale: String = \"AUTO\", val apiUrl: String = \"local_gguf\", val apiModel: String = \"\", val apiKey: String = \"\", val temp: Float = 0.5f)")
          t = t.replace("p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\")", "p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\", p.getString(\"ai_host_url\", \"local_gguf\")?.ifBlank { \"local_gguf\" } ?: \"local_gguf\", p.getString(\"ai_host_model\", \"\") ?: \"\", p.getString(\"ai_host_key\", \"\") ?: \"\", p.getFloat(\"ai_temp\", 0.5f))")
          t = t.replace(".putString(\"ui_scale_mode\", c.uiScale).apply()", ".putString(\"ui_scale_mode\", c.uiScale).putString(\"ai_host_url\", c.apiUrl.trim()).putString(\"ai_host_model\", c.apiModel.trim()).putString(\"ai_host_key\", c.apiKey.trim()).putFloat(\"ai_temp\", c.temp).apply()")
          _b = []
          _b += ['Column(Modifier.verticalScroll(rememberScrollState()).padding(ui.cardPad), verticalArrangement = Arrangement.spacedBy(7.dp)) {', 'val pScope = rememberCoroutineScope()', 'val chatGPick = androidx.activity.compose.rememberLauncherForActivityResult(androidx.activity.result.contract.ActivityResultContracts.OpenDocument()) { u ->']
          _b += ['if (u != null) { testReport = "⏳ 채팅용 GGUF 모델 등록 중..."; pScope.launch { testReport = importGgufModelUri(ctx, u, false) } }', '}', 'val embGPick = androidx.activity.compose.rememberLauncherForActivityResult(androidx.activity.result.contract.ActivityResultContracts.OpenDocument()) { u ->']
          _b += ['if (u != null) { testReport = "⏳ 임베딩젬마2 텍스트 GGUF 등록·검증 중..."; pScope.launch { testReport = importGgufModelUri(ctx, u, true) } }', '}', 'Text("🦙 1. 초경량 텍스트 전용 GGUF & 임베딩젬마2", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)']
          _b += ['Text("채팅: " + AiResidentManager.gemmaName.take(22) + (if (AiResidentManager.gemmaMb > 0L) " (${AiResidentManager.gemmaMb}MB)" else "") + "  |  임베딩: " + AiResidentManager.embedName.take(18) + (if (AiResidentManager.embedMb > 0L) " (${AiResidentManager.embedMb}MB)" else ""), fontSize = ui.subSp, color = CM)']
          _b += ['Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {', 'ChipBtn("📂 채팅 LLM (.gguf) 올리기", AiResidentManager.gemmaMb > 0L, CG) { chatGPick.launch(arrayOf("*/*")) }', 'ChipBtn("📂 임베딩젬마2 (.gguf) 올리기", AiResidentManager.embedMb > 0L, CA) { embGPick.launch(arrayOf("*/*")) }']
          _b += ['ChipBtn("🗑️ 모델 비우기", false, Color(0xFFF87171)) { testReport = AiResidentManager.clearStorage(ctx) }', '}', 'testReport?.let { rep -> Text(rep, fontSize = ui.subSp, color = CG) }', 'Text("⚡ 2. 구동 방식 & AI 호칭 설정", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CW)']
          _b += ['Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {', 'ChipBtn("🧠 오프라인 단독 (GGUF 전용)", aiCfg.apiUrl == "local_gguf" || aiCfg.apiUrl.isBlank(), CG) { val u = aiCfg.copy(apiUrl = "local_gguf"); onUpdate(u); saveAiCfg(ctx, u); testReport = "✅ 초경량 GGUF 오프라인 단독 모드 활성" }']
          _b += ['ChipBtn("🦙 외부 Ollama (11434)", aiCfg.apiUrl.contains("11434"), CA) { val u = aiCfg.copy(apiUrl = "http" + "://127.0.0.1:11434"); onUpdate(u); saveAiCfg(ctx, u); testReport = "✅ 외부 Ollama(11434) 실시간 스트리밍 연동됨" }', '}']
          _b += ['OutlinedTextField(value = aiCfg.apiUrl, onValueChange = { val u = aiCfg.copy(apiUrl = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text("모드 또는 서버 주소 (local_gguf / http" + "://127.0.0.1:11434)") }, singleLine = true, modifier = Modifier.fillMaxWidth())', 'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {']
          _b += ['OutlinedTextField(value = aiCfg.apiModel, onValueChange = { val u = aiCfg.copy(apiModel = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text("로컬 AI 이름 (예: 자비스)") }, singleLine = true, modifier = Modifier.weight(1f))']
          _b += ['OutlinedTextField(value = aiCfg.apiKey, onValueChange = { val u = aiCfg.copy(apiKey = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text("API Key (오프라인 비워둠)") }, singleLine = true, modifier = Modifier.weight(1f))', '}', 'Row(Modifier.fillMaxWidth(), SB, CV) {', 'Text("⚙️ 3. 프롬프트 & RAG 프리셋"']
          panel_ui = chr(10).join(_b)
          t = re.sub(r"Column\(Modifier\.verticalScroll.*?Text\(\"⚙️ 2\. 기본 프롬프트 수정 & 프리셋\"", lambda _: panel_ui, t, flags=re.S)
          t = t.replace("Surface(color = Color(0xFF14161F), shape = RoundedCornerShape(12.dp), border = BorderStroke(1.dp, CA)", "Surface(color = Color(0xFF0F1624), shape = RoundedCornerShape(16.dp), border = BorderStroke(0.8.dp, Color(0xFF28354E))")
          open(kf, "w").write(t)
          mf = "app/src/main/AndroidManifest.xml"; m = open(mf).read()
          for pm in ["FOREGROUND_SERVICE", "FOREGROUND_SERVICE_DATA_SYNC", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "RECORD_AUDIO"]: m = m if f".{pm}\"" in m else m.replace("<application", f"<uses-permission android:name=\"android.permission.{pm}\" />\n<application", 1)
          if "largeHeap" not in m: m = m.replace("<application", "<application android:largeHeap=\"true\"", 1)
          if "usesCleartextTraffic" not in m: m = m.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
          if "libOpenCL.so" not in m: m = m.replace("</application>", "<uses-native-library android:name=\"libvndksupport.so\" android:required=\"false\" /><uses-native-library android:name=\"libOpenCL.so\" android:required=\"false\" /></application>", 1)
          if "AiResidentService" not in m: m = m.replace("</application>", "<service android:name=\".AiResidentService\" android:exported=\"false\" android:foregroundServiceType=\"dataSync\" /></application>", 1)
          else: m = m.replace("android:name=\".AiResidentService\" android:exported=\"false\"", "android:name=\".AiResidentService\" android:exported=\"false\" android:foregroundServiceType=\"dataSync\"")
          open(mf, "w").write(m.replace("singleTask", "singleTop"))
          gf = "app/build.gradle.kts"; g = open(gf).read()
          g = re.sub(r"[^\n]*tasks-genai[^\n]*\n?", "", g)
          g = re.sub(r"tasks-text:[0-9.]+", "tasks-text:0.10.21", g)
          g = g.replace("compileSdk = 34", "compileSdk = 35")
          g = re.sub(r"versionCode\s*=\s*[^\n]+", "versionCode = 9" + os.environ.get("GITHUB_RUN_NUMBER", "95"), g)
          g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "9.5.0"', g)
          if "abiFilters" not in g: g = g.replace("defaultConfig {", "defaultConfig {\nndk { abiFilters += listOf(\"arm64-v8a\") }", 1)
          if "llama-android" not in g: g = g.replace("dependencies {", "dependencies {\nimplementation(\"dev.ffmpegkit-maintained:llama-android:0.1.1\")", 1)
          if os.path.exists("app/fixed.keystore") and "fixed.keystore" not in g: g = g.replace("buildFeatures {", "signingConfigs { getByName(\"debug\") { storeFile = file(\"fixed.keystore\") } }\nbuildFeatures {", 1)
          open(gf, "w").write(g)
          PYEOF
      - name: Upgrade v9.5 GGUF Embed
        run: |
          python3 -c 'import sys; exec(sys.stdin.read())' << 'PYEOF'
          import os
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"; t = open(kf).read()
          _b = []
          _b += ['var appCtxRef: Context? = null', 'val llmMutex = kotlinx.coroutines.sync.Mutex()', 'var ggufRunner: (suspend (String, String, Int) -> String)? = null', 'var ggufDropper: (suspend () -> Unit)? = null', 'var ggufLoadedPath: String = ""', 'var embRunner: (suspend (String) -> FloatArray)? = null', 'var embDropper: (suspend () -> Unit)? = null', 'var embLoadedPath: String = ""']
          _b += ['val embedVecCache = java.util.concurrent.ConcurrentHashMap<String, FloatArray>()', 'var activeGenId: Long = 0L', 'var thinkOn by androidx.compose.runtime.mutableStateOf(false)', 'var streamOn by androidx.compose.runtime.mutableStateOf(true)', '', 'fun optThreads(): Int = (Runtime.getRuntime().availableProcessors() - 2).coerceIn(2, 6)']
          _b += ['fun setThinkOn(ctx: Context, on: Boolean) { thinkOn = on; ctx.getSharedPreferences("pl_ai_v2_prefs", 0).edit().putBoolean("ai_think_on", on).apply() }', 'fun setStreamOn(ctx: Context, on: Boolean) { streamOn = on; ctx.getSharedPreferences("pl_ai_v2_prefs", 0).edit().putBoolean("ai_stream_on", on).apply() }', '']
          _b += ['fun isGgufFile(f: java.io.File): Boolean = f.isFile && f.length() > 1048576L && (f.name.endsWith(".gguf", true) || runCatching { val b = ByteArray(4); java.io.FileInputStream(f).use { it.read(b) == 4 && String(b, Charsets.US_ASCII) == "GGUF" } }.getOrDefault(false))']
          _b += ['fun isEmbedModelName(nm: String): Boolean = nm.lowercase().let { it.contains("embed") || it.contains("bge") || it.contains("e5-") || it.contains("nomic") || it.contains("minilm") }', '', 'fun baseFilesDir(): java.io.File = appCtxRef?.filesDir ?: java.io.File("/data/data/app.prolauncher.ai.v3/files")', 'fun findEmbedGguf(): java.io.File? {', 'val base = baseFilesDir()']
          _b += ['java.io.File(base, "embed_models").listFiles()?.filter { isGgufFile(it) }?.maxByOrNull { it.lastModified() }?.let { return it }', 'return listOf(java.io.File(base, "models"), java.io.File(base, "llm_models"), base).flatMap { it.listFiles()?.toList() ?: emptyList() }.filter { isGgufFile(it) && isEmbedModelName(it.name) }.maxByOrNull { it.lastModified() }', '}']
          _b += ['fun findLocalGguf(): java.io.File? {', 'val embP = findEmbedGguf()?.absolutePath ?: ""', 'val base = baseFilesDir()', 'return listOf(java.io.File(base, "llm_models"), java.io.File(base, "models"), base).flatMap { it.listFiles()?.toList() ?: emptyList() }.filter { isGgufFile(it) && it.absolutePath != embP && !isEmbedModelName(it.name) }.maxByOrNull { it.lastModified() }', '}']
          _b += ['fun findBestLocalModel(): java.io.File? = findLocalGguf()', '', 'fun refreshDetectedModelNames() = runCatching {', 'findLocalGguf()?.let { f -> AiResidentManager.gemmaName = f.name; AiResidentManager.gemmaMb = f.length() / 1048576L }', 'findEmbedGguf()?.let { f -> AiResidentManager.embedName = f.name; AiResidentManager.embedMb = f.length() / 1048576L }', '}', '', 'fun releaseGguf() {']
          _b += ['val d = ggufDropper; ggufRunner = null; ggufDropper = null; ggufLoadedPath = ""', 'if (d != null) runCatching { kotlinx.coroutines.runBlocking { runCatching { d.invoke() } } }', '}', 'fun releaseEmbedGguf() {', 'val d = embDropper; embRunner = null; embDropper = null; embLoadedPath = ""', 'if (d != null) runCatching { kotlinx.coroutines.runBlocking { runCatching { d.invoke() } } }', '}']
          _b += ['fun releaseAllLocalModels() {', 'releaseGguf()', 'releaseEmbedGguf()', 'embedVecCache.clear()', '}', '', 'fun normVec(v: FloatArray): FloatArray {', 'var s = 0f; for (x in v) s += x * x', 'val n = kotlin.math.sqrt(s).coerceAtLeast(1e-6f)', 'return FloatArray(v.size) { i -> v[i] / n }', '}', 'fun dotCos(a: FloatArray, b: FloatArray): Float {']
          _b += ['val n = minOf(a.size, b.size); if (n == 0) return 0f', 'var d = 0f; for (i in 0 until n) d += a[i] * b[i]', 'return d.coerceIn(-1f, 1f)', '}', '', 'suspend fun embedWithGguf(rawText: String, isQuery: Boolean, docTitle: String = "메모"): FloatArray? {', 'val ef = findEmbedGguf() ?: return null', 'val clean = rawText.replace("\\n", " ").trim().take(if (isQuery) 320 else 480)']
          _b += ['if (clean.isEmpty()) return null', 'val formatted = if (isQuery) "task: search result | query: $clean" else "title: ${docTitle.ifBlank { "none" }} | text: $clean"', 'val cKey = "${ef.name}_${ef.length()}_${isQuery}_${formatted.hashCode()}"', 'embedVecCache[cKey]?.let { return it }', 'llmMutex.lock()', 'try {', 'return runCatching {', 'val path = ef.absolutePath']
          _b += ['if (embRunner == null || embLoadedPath != path) {', 'embDropper?.invoke()', 'val em = dev.ffmpegkit.llama.Llama.loadModel(modelPath = path, config = dev.ffmpegkit.llama.LlamaConfig(contextSize = 512, threads = optThreads()))', 'embLoadedPath = path', 'AiResidentManager.embedName = ef.name; AiResidentManager.embedMb = ef.length() / 1048576L']
          _b += ['embRunner = { txt -> dev.ffmpegkit.llama.Llama.embed(em, txt) }', 'embDropper = { runCatching { dev.ffmpegkit.llama.Llama.releaseModel(em) } }', '}', 'val rawV = embRunner?.invoke(formatted)', 'if (rawV != null && rawV.isNotEmpty()) {', 'val nv = normVec(rawV)', 'if (embedVecCache.size > 512) embedVecCache.clear()', 'embedVecCache[cKey] = nv', 'nv', '} else null']
          _b += ['}.onFailure { embRunner = null; embDropper = null; embLoadedPath = "" }.getOrNull()', '} finally {', 'llmMutex.unlock()', '}', '}', '', 'suspend fun importGgufModelUri(ctx: Context, uri: android.net.Uri, forEmbed: Boolean): String = kotlinx.coroutines.withContext(Dispatchers.IO) {', 'appCtxRef = ctx.applicationContext', 'var name = if (forEmbed) "embeddinggemma2.gguf" else "local_llm.gguf"']
          _b += ['runCatching {', 'ctx.contentResolver.query(uri, null, null, null, null)?.use { c ->', 'val idx = c.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)', 'if (idx >= 0 && c.moveToFirst()) name = c.getString(idx)', '}', '}', 'val low = name.lowercase()', 'if (low.endsWith(".litertlm") || low.endsWith(".task") || low.endsWith(".tflite")) {']
          _b += ['return@withContext "⚠️ 경량화를 위해 .gguf 텍스트 전용 모델만 지원합니다. (.gguf 파일을 선택해 주세요)"', '}', 'val subDir = if (forEmbed) "embed_models" else "llm_models"', 'val dir = java.io.File(ctx.applicationContext.filesDir, subDir).apply { mkdirs() }', 'if (forEmbed) releaseEmbedGguf() else releaseGguf()', 'dir.listFiles()?.forEach { runCatching { it.delete() } }']
