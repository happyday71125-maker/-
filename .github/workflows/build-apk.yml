"P_32": "object ScheduleBriefingManager { private const val CH_ID = Zqpl_briefing_chZq; private val mdRx = Regex(Zq(ZbbZbbd{1,2})ZbbZbbs*월ZbbZbbs*(ZbbZbbd{1,2})ZbbZbbs*일Zq); private val tmRx = Regex(Zq(오전|오후|아침|점심|저녁|밤)?ZbbZbbs*(ZbbZbbd{1,2})ZbbZbbs*시(?:ZbbZbbs*(ZbbZbbd{1,2})ZbbZbbs*분|ZbbZbbs*(반))?Zq)Zbnfun parseLineSchedule(line: String, nowMs: Long = System.currentTimeMillis()): Pair<Long, String>? { val tr = line.trim(); if (tr.isEmpty() || tr.startsWith(Zq☑Zq) || tr.startsWith(Zq#Zq)) return null; val tm = tmRx.find(tr) ?: return null; val ap = tm.groupValues[1]; var hr = tm.groupValues[2].toIntOrNull() ?: return null; val mn = if (tm.groupValues[4] == Zq반Zq) 30 else (tm.groupValues[3].toIntOrNull() ?: 0); if (hr !in 0..24 || mn !in 0..59) return null; if ((ap == Zq오후Zq || ap == Zq저녁Zq || ap == Zq밤Zq) && hr in 1..11) hr += 12 else if (ap == Zq점심Zq && hr in 1..3) hr += 12 else if (ap == Zq오전Zq && hr == 12) hr = 0; val cal = java.util.Calendar.getInstance().apply { timeInMillis = nowMs; set(java.util.Calendar.SECOND, 0); set(java.util.Calendar.MILLISECOND, 0) }; val md = mdRx.find(tr); var dTag = Zq오늘Zq; if (md != null) { val mo = (md.groupValues[1].toIntOrNull() ?: 1) - 1; val dy = md.groupValues[2].toIntOrNull() ?: 1; cal.set(java.util.Calendar.MONTH, mo.coerceIn(0, 11)); cal.set(java.util.Calendar.DAY_OF_MONTH, dy.coerceIn(1, 31)); dTag = Zq${mo + 1}/${dy}Zq } else if (tr.contains(Zq모레Zq)) { cal.add(java.util.Calendar.DAY_OF_YEAR, 2); dTag = Zq모레Zq } else if (tr.contains(Zq내일Zq)) { cal.add(java.util.Calendar.DAY_OF_YEAR, 1); dTag = Zq내일Zq }; cal.set(java.util.Calendar.HOUR_OF_DAY, hr.coerceIn(0, 23)); cal.set(java.util.Calendar.MINUTE, mn); if (md == null && !tr.contains(Zq내일Zq) && !tr.contains(Zq모레Zq) && !tr.contains(Zq오늘Zq) && cal.timeInMillis <= nowMs) { cal.add(java.util.Calendar.DAY_OF_YEAR, 1); dTag = Zq내일Zq }; return cal.timeInMillis to Zq$dTag %02d:%02dZq.format(hr.coerceIn(0, 23), mn) }Zbn",
