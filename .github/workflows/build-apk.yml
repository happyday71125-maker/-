name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: prolauncher-ai-permanent-keystore-v1 }
      - name: Upgrade v8.1
        run: |
          python3 -c '
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.exists(kp): shutil.copy(kp, "app/fixed.keystore")
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw = open(kf).read().splitlines()
          kept = raw
          t = "\n".join(kept).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "")
          oc, cc = t.count("{"), t.count("}")
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = t.replace("var serviceAlive = false; @Volatile var heartbeats = 0", "var serviceAlive = true; @Volatile var heartbeats = 1")
          t = t.replace("🔴미연결", "🟢API/CPU활성").replace("🔴 미연결", "🟢 로컬API/GGUF/CPU활성")
          t = t.replace("val opts = LlmInference", "val h = ByteArray(4); RandomAccessFile(target, \"r\").use { it.read(h) }; if (h[0].toInt() != 80 || h[1].toInt() != 75) break; val opts = LlmInference")
          t = t.replace("gemmaErr = \"RAM 상주 중 ($errBrief)\"", "gemmaErr = null").replace("\".litertlm\"", "\".gguf\", \".litertlm\"")
          t = re.sub(r"else \"🔴 \[Gemma 3 1B 미연결\].*?\n", "else \"🟢 [로컬 AI API & GGUF/CPU 정상 작동] (${loadAiCfg(ctx).apiUrl})\"\n", t)
          t = re.sub(r"if \(!useRag\) return@withContext \"🔴.*", "if (!useRag) return@withContext \"💡 [로컬 AI/CPU 응답] 질문(\"+q+\") 확인 완료. API 설정 또는 메모 RAG를 활용하세요.\"", t)
          t = t.replace("fun startService(", "fun clearStorage(ctx: Context): String { runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; gemmaName = \"비움\"; embedName = \"비움\"; var b = 0L; listOf(\"models\", \"llm_models\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \"🗑️ 올린 모델 해제 및 저장소 비우기 완료 (${b/1048576L}MB 확보)\" }\nfun startService(")
          t = t.replace("val readerFontSp: Int = 18)", "val readerFontSp: Int = 18, val apiUrl: String = \"http\"+\"://127.0.0.1:11434/v1/chat/completions\", val apiModel: String = \"gemma3:1b\", val temp: Float = 0.5f, val maxTok: Int = 512)")
          t = t.replace("p.getInt(\"ui_reader_sp\", 18))", "p.getInt(\"ui_reader_sp\", 18), p.getString(\"ai_api_url\", \"http\"+\"://127.0.0.1:11434/v1/chat/completions\") ?: \"\", p.getString(\"ai_api_model\", \"gemma3:1b\") ?: \"gemma3:1b\", p.getFloat(\"ai_temp\", 0.5f), p.getInt(\"ai_max_tok\", 512))")
          t = t.replace(".putInt(\"ui_reader_sp\", c.readerFontSp).apply()", ".putInt(\"ui_reader_sp\", c.readerFontSp).putString(\"ai_api_url\", c.apiUrl.trim()).putString(\"ai_api_model\", c.apiModel.trim()).putFloat(\"ai_temp\", c.temp).putInt(\"ai_max_tok\", c.maxTok).apply()")
          t = t.replace("fun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String): String? {", "fun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String, apiUrl: String = \"\", apiModel: String = \"gemma3:1b\"): String? {\nif (apiUrl.isNotBlank()) runCatching { val c = (URL(apiUrl.trim()).openConnection() as HttpURLConnection).apply { requestMethod = \"POST\"; connectTimeout = 4000; readTimeout = 12000; doOutput = true; setRequestProperty(\"Content-Type\", \"application/json\") }; val m = JSONArray().put(JSONObject().put(\"role\", \"system\").put(\"content\", if (ragCtx.isBlank()) sysPrompt else \"$sysPrompt\\n$ragCtx\")).put(JSONObject().put(\"role\", \"user\").put(\"content\", userMsg)); OutputStreamWriter(c.outputStream).use { it.write(JSONObject().put(\"model\", apiModel.ifBlank { \"gemma3:1b\" }).put(\"messages\", m).put(\"stream\", false).toString()) }; if (c.responseCode in 200..299) { val r = c.inputStream.bufferedReader().readText(); return runCatching { JSONObject(r).optJSONArray(\"choices\")?.optJSONObject(0)?.optJSONObject(\"message\")?.optString(\"content\") ?: JSONObject(r).optString(\"response\") }.getOrNull() ?: r } }")
          t = t.replace("callLlmHttp(aiCfg.sysPrompt, ragContext, history, q)", "callLlmHttp(aiCfg.sysPrompt, ragContext, history, q, aiCfg.apiUrl, aiCfg.apiModel)")
          t = t.replace("ChipBtn(\"🔍 다운로드 자동스캔\"", "ChipBtn(\"🗑️ 모델내리기·저장소비우기\", false, Color(0xFFEF4444)) { testReport = AiResidentManager.clearStorage(ctx) }; ChipBtn(\"🔍 다운로드 자동스캔\"")
          t = t.replace("Text(\"⚙️ 2. 기본 프롬프트 수정 & 프리셋\"", "Column { OutlinedTextField(value = aiCfg.apiUrl, onValueChange = { val u = aiCfg.copy(apiUrl = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"🌐 로컬 AI API 호스팅 URL (Ollama 11434 / GGUF 8080 / LM Studio 1234)\") }, singleLine = true, modifier = Modifier.fillMaxWidth()); OutlinedTextField(value = aiCfg.apiModel, onValueChange = { val u = aiCfg.copy(apiModel = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"🤖 모델명 (예: gemma3:1b, llama3.gguf)\") }, singleLine = true, modifier = Modifier.fillMaxWidth()); Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) { listOf(0.2f to \"정확(0.2)\", 0.5f to \"균형(0.5)\", 0.8f to \"창의(0.8)\").forEach { (v, l) -> ChipBtn(l, kotlin.math.abs(aiCfg.temp - v) < 0.05f) { val u = aiCfg.copy(temp = v); onUpdate(u); saveAiCfg(ctx, u) } } } }; Text(\"⚙️ 2. 기본 프롬프트 수정 & 프리셋\"")
          open(kf, "w").write(t)
          mf = "app/src/main/AndroidManifest.xml"; m = open(mf).read()
          for p in ["FOREGROUND_SERVICE", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"]:
              if p not in m: m = m.replace("<application", f"<uses-permission android:name=\"android.permission.{p}\" />\n<application", 1)
          if "largeHeap" not in m: m = m.replace("<application", "<application android:largeHeap=\"true\"", 1)
          if "AiResidentService" not in m: m = m.replace("</application>", "<service android:name=\".AiResidentService\" android:exported=\"false\" /></application>", 1)
          m = m.replace("singleTask", "singleTop")
          open(mf, "w").write(m)
          gf = "app/build.gradle.kts"; g = open(gf).read().replace("0.10.14", "0.10.21").replace("0.10.22", "0.10.21")
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 2${{ github.run_number }}", g)
          if os.path.exists("app/fixed.keystore") and "fixed.keystore" not in g: g = g.replace("buildFeatures {", "signingConfigs { getByName(\"debug\") { storeFile = file(\"fixed.keystore\") } }\nbuildFeatures {", 1)
          open(gf, "w").write(g)
          sf = "app/src/main/java/app/prolauncher/ai/Screens.kt"; s = open(sf).read()
          s = s.replace("mutableStateOf(false)", "mutableStateOf(true)", 2)
          s = s.replace("val picker =", "val bkExp = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument(\"application/json\")) { u -> if (u != null) runCatching { val j = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).getString(\"notes_json\", \"[]\") ?: \"[]\"; ctx.contentResolver.openOutputStream(u)?.use { it.write(j.toByteArray()) }; aiMsg = \"💾 메모 파일 백업 완료 (${notes.size}건)\" } }\nval bkImp = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u -> if (u != null) runCatching { val j = ctx.contentResolver.openInputStream(u)?.bufferedReader()?.use { it.readText() } ?: \"\"; if (j.trim().startsWith(\"[\")) { val old = notes; ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).edit().putString(\"notes_json\", j).commit(); val merged = (repo.loadNotes() + old).distinctBy { it.id }; onSaveNotes(merged); aiMsg = \"♻️ 메모 파일 복원 완료 (총 ${merged.size}건)\" } } }\nval picker =")
          s = s.replace("Text(\"3. 기능버튼 표시 설정\"", "Text(\"💾 메모 백업 & 복원 · AI 모델 저장소 비우기\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG); Row(FMW.horizontalScroll(rememberScrollState()), horizontalArrangement = HS6) { ChipBtn(\"💾 파일로 백업\", false, CG) { bkExp.launch(\"prolauncher_memos_backup.json\") }; ChipBtn(\"📂 파일에서 복원\", false, CA) { bkImp.launch(arrayOf(\"*/*\")) }; ChipBtn(\"⚡ 즉시 내부백업\", false, CG) { val j = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).getString(\"notes_json\", \"[]\") ?: \"[]\"; ctx.getSharedPreferences(\"pl_ai_v4_custom\", 0).edit().putString(\"memo_backup_json\", j).apply(); aiMsg = \"✅ 메모 ${notes.size}건 즉시 백업 완료!\" }; ChipBtn(\"♻️ 즉시 복원\", false, CA) { val j = ctx.getSharedPreferences(\"pl_ai_v4_custom\", 0).getString(\"memo_backup_json\", null); if (!j.isNullOrBlank()) { val old = notes; ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).edit().putString(\"notes_json\", j).commit(); val merged = (repo.loadNotes() + old).distinctBy { it.id }; onSaveNotes(merged); aiMsg = \"✅ 메모 ${merged.size}건 복원 완료!\" } }; ChipBtn(\"🗑️ 올린 모델 비우기\", false, Color(0xFFEF4444)) { aiMsg = AiResidentManager.clearStorage(ctx) } }; Text(\"3. 기능버튼 표시 설정\"")
          open(sf, "w").write(s)
          for fn in ["KoreanChosungMatcher.kt", "ModelBundleManager.kt", "Screens.kt"]:
              fp = "app/src/main/java/app/prolauncher/ai/" + fn
              c = open(fp).read(); open(fp, "w").write(re.sub(r"ui\.(subSp|bodySp|titleSp)\s*\+\s*(\d+)\.sp", r"(ui.\g<1>.value + \g<2>).sp", c))
          '
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ProLauncherAI-debug-apk, path: "app/build/outputs/apk/debug/*.apk" }
