          t = re.sub(r"if \(!useRag\) return@withContext \"🔴.*", "if (!useRag) return@withContext wikiAns(q, ragContext)", t)
          t = re.sub(r"Text\(\"🔒 1\..*?ChipBtn\(\"📂 Gemma 3 1B 선택\"", "Text(\"🤖 1. 로컬 AI (GGUF) & 임베딩 모델 (\" + AiResidentManager.gemmaName + \" / \" + AiResidentManager.embedName + \")\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)\nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nChipBtn(\"📂 로컬 AI (GGUF) 올리기\"", t, flags=re.S)
          t = t.replace("ChipBtn(\"📂 임베딩젬마2 선택\"", "ChipBtn(\"📂 임베딩 모델 올리기\"")
          t = re.sub(r"ChipBtn\(\"🔍 다운로드 자동스캔\".*?testReport\?\.let", "ChipBtn(\"🗑️ 모델/저장소 비우기\", false, Color(0xFFEF4444)) { testReport = AiResidentManager.clearStorage(ctx) }\n}\ntestReport?.let", t, flags=re.S)
          api_ui = "Column(verticalArrangement = Arrangement.spacedBy(6.dp)) { Text(\"🦙 2. Ollama (올라마) & API 설정\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG); Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) { ChipBtn(\"🦙 Ollama (11434 자동감지)\", aiCfg.apiUrl.contains(\"11434\"), CG) { val u = aiCfg.copy(apiUrl = \"http\" + \"://127.0.0.1:11434\", apiModel = \"\"); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn(\"🧠 로컬 GGUF 단독모드\", aiCfg.apiUrl == \"local_gguf\", CG) { val u = aiCfg.copy(apiUrl = \"local_gguf\"); onUpdate(u); saveAiCfg(ctx, u) } }; OutlinedTextField(value = aiCfg.apiUrl, onValueChange = { val u = aiCfg.copy(apiUrl = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"Ollama / API 주소 (기본: http\" + \"://127.0.0.1:11434)\") }, singleLine = true, modifier = Modifier.fillMaxWidth()); Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) { OutlinedTextField(value = aiCfg.apiModel, onValueChange = { val u = aiCfg.copy(apiModel = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"모델명 (비워두면 자동감지)\") }, singleLine = true, modifier = Modifier.weight(1f)); OutlinedTextField(value = aiCfg.apiKey, onValueChange = { val u = aiCfg.copy(apiKey = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"API Key (올라마는 비워둠)\") }, singleLine = true, modifier = Modifier.weight(1f)) } }; Text(\"⚙️ 3. 프롬프트 & 프리셋\""
