name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Permanent Debug Keystore (No Conflict on Update)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1

      - name: Prepare Resident AI Engine & Fixed Signing Key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -noprompt -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" < /dev/null
          fi
          cp ~/.android/debug.keystore app/fixed.keystore
          sed -i -E 's/ui\.(subSp|bodySp|titleSp) \+ ([0-9]+)\.sp/(ui.\1.value + \2).sp/g' app/src/main/java/app/prolauncher/ai/*.kt
          cat << 'PYEOF' > /tmp/prep.py
          import glob, re
          mf = "app/src/main/AndroidManifest.xml"
          m = open(mf, encoding="utf-8").read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
              '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n'
          )
          if "FOREGROUND_SERVICE" not in m:
              m = m.replace("<application", perms + "    <application", 1)
          if "largeHeap" not in m:
              m = m.replace("<application", '<application\n        android:largeHeap="true"', 1)
          m = m.replace('android:launchMode="singleTask"', 'android:launchMode="singleTop"')
          m = m.replace('android:clearTaskOnLaunch="true"', '')
          m = m.replace('android:stateNotNeeded="true"', '')
          m = m.replace('android:excludeFromRecents="true"', '')
          if "AiResidentService" not in m:
              svc = (
                  '        <uses-native-library android:name="libvndksupport.so" android:required="false" />\n'
                  '        <uses-native-library android:name="libOpenCL.so" android:required="false" />\n'
                  '        <service android:name=".AiResidentService" android:enabled="true" android:exported="false" />\n'
                  '    </application>'
              )
              m = m.replace("</application>", svc, 1)
          open(mf, "w", encoding="utf-8").write(m)

          f = "app/build.gradle.kts"
          s = open(f, encoding="utf-8").read()
          s = s.replace("0.10.14", "0.10.21")
          s = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 1${{ github.run_number }}", s)
          s = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "7.3.${{ github.run_number }}"', s)
          if "fixed.keystore" not in s:
              sc = (
                  '    signingConfigs {\n'
                  '        getByName("debug") {\n'
                  '            storeFile = file("fixed.keystore")\n'
                  '            storePassword = "android"\n'
                  '            keyAlias = "androiddebugkey"\n'
                  '            keyPassword = "android"\n'
                  '        }\n'
                  '    }\n'
              )
              s = s.replace("buildFeatures {", sc + "buildFeatures {", 1)
          open(f, "w", encoding="utf-8").write(s)

          for p in glob.glob("app/src/main/java/**/*.kt", recursive=True):
              kt = open(p, encoding="utf-8").read()
              o, c = kt.count("{"), kt.count("}")
              if c > o:
                  lines = kt.rstrip().splitlines()
                  while c > o and lines and lines[-1].strip() == "}":
                      lines.pop()
                      c -= 1
                  open(p, "w", encoding="utf-8").write("\n".join(lines) + "\n")

          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          kt = open(kf, encoding="utf-8").read()
          i1 = kt.find("data class ResponsiveUi")
          i2 = kt.find("data class ChatMsg")
          if i1 != -1 and i2 != -1 and "UiScaleFontSection" not in kt:
              new_b = '''data class ResponsiveUi(
          val hPad: Dp, val vPad: Dp, val cardPad: Dp,
          val titleSp: TextUnit, val bodySp: TextUnit, val subSp: TextUnit,
          val panelMaxH: Dp, val isCompact: Boolean,
          val clockSp: TextUnit = 48.sp, val appSp: TextUnit = 21.sp,
          val menuSp: TextUnit = 11.sp, val menuHPad: Dp = 9.dp, val menuVPad: Dp = 5.dp,
          val readerSp: Int = 18
          )
          @Composable
          fun rememberUi(scaleMode: String = "AUTO"): ResponsiveUi {
          val ctx = LocalContext.current
          val tick = AiResidentManager.uiTick
          LaunchedEffect(Unit) { AiResidentManager.ensureStartedAndLoaded(ctx) }
          val cfg = remember(tick, scaleMode) { loadAiCfg(ctx) }
          val mode = if (scaleMode != "AUTO") scaleMode else cfg.uiScale
          val conf = LocalConfiguration.current; val w = conf.screenWidthDp; val h = conf.screenHeightDp
          val mult = when (mode) { "COMPACT" -> 0.88f; "LARGE" -> 1.12f; else -> if (h < 700 || w < 350) 0.90f else if (h > 850 || w > 410) 1.06f else 1.0f }
          val mScale = (cfg.menuScalePct.coerceIn(75, 140) / 100f) * mult
          val compact = h < 700 || w < 350 || mode == "COMPACT"
          val bodyVal = (cfg.memoFontSp.coerceIn(11, 22) * mult).coerceIn(11f, 24f)
          val menuVal = (cfg.menuFontSp.coerceIn(9, 18) * mScale).coerceIn(9f, 20f)
          val homeVal = (cfg.homeFontSp.coerceIn(15, 30) * mult).coerceIn(15f, 32f)
          return ResponsiveUi(((if (compact) 10f else 14f) * mult).dp, ((if (compact) 7f else 11f) * mult).dp, ((if (compact) 8f else 11f) * mult).dp, (bodyVal + 3f).sp, bodyVal.sp, menuVal.sp, (h * 0.52f).coerceIn(240f, 440f).dp, compact, (homeVal * 2.25f).coerceIn(36f, 64f).sp, homeVal.sp, menuVal.sp, (9f * mScale).coerceIn(6f, 16f).dp, (5f * mScale).coerceIn(3f, 10f).dp, cfg.readerFontSp.coerceIn(14, 30))
          }
          const val DEF_SYS_PROMPT = "당신은 사용자의 질문 의도를 정확히 파악해 핵심만 명쾌하고 논리적으로 답하는 스마트 AI 챗봇입니다. 동문서답 없이 사용자의 질문에 직접적으로, 구체적이고 실용적인 한국어로 답변하세요."
          val PROMPT_PRESETS = listOf("🤖 기본 비서" to DEF_SYS_PROMPT, "📌 핵심 요약" to "핵심 결론을 먼저 1줄로 제시하고 세부 요점을 글머리(•)로 간결하게 정리하세요.", "💡 기획 코치" to "주제에 대해 실행 가능한 아이디어 3가지와 구체적인 첫 단계를 제안하세요.", "✍️ 문장 교정" to "사용자의 문장을 자연스럽고 세련된 한국어 표현으로 다듬어 주세요.")
          data class AiRagConfig(val sysPrompt: String = DEF_SYS_PROMPT, val ragOn: Boolean = false, val ragScope: String = "ALL", val ragTopK: Int = 5, val ragBooks: Boolean = true, val ragImpOnly: Boolean = false, val uiScale: String = "AUTO", val menuScalePct: Int = 100, val memoFontSp: Int = 14, val menuFontSp: Int = 11, val homeFontSp: Int = 21, val readerFontSp: Int = 18)
          fun loadAiCfg(ctx: Context): AiRagConfig {
          val p = ctx.getSharedPreferences("pl_ai_v4_custom", Context.MODE_PRIVATE)
          return AiRagConfig(p.getString("ai_sys_prompt", DEF_SYS_PROMPT)?.ifBlank { DEF_SYS_PROMPT } ?: DEF_SYS_PROMPT, p.getBoolean("ai_rag_on", false), p.getString("ai_rag_scope", "ALL") ?: "ALL", p.getInt("ai_rag_topk", 5), p.getBoolean("ai_rag_books", true), p.getBoolean("ai_rag_imp", false), p.getString("ui_scale_mode", "AUTO") ?: "AUTO", p.getInt("ui_menu_pct", 100), p.getInt("ui_memo_sp", 14), p.getInt("ui_menu_sp", 11), p.getInt("ui_home_sp", 21), p.getInt("ui_reader_sp", 18))
          }
          fun saveAiCfg(ctx: Context, c: AiRagConfig) {
          ctx.getSharedPreferences("pl_ai_v4_custom", Context.MODE_PRIVATE).edit().putString("ai_sys_prompt", c.sysPrompt).putBoolean("ai_rag_on", c.ragOn).putString("ai_rag_scope", c.ragScope).putInt("ai_rag_topk", c.ragTopK).putBoolean("ai_rag_books", c.ragBooks).putBoolean("ai_rag_imp", c.ragImpOnly).putString("ui_scale_mode", c.uiScale).putInt("ui_menu_pct", c.menuScalePct).putInt("ui_memo_sp", c.memoFontSp).putInt("ui_menu_sp", c.menuFontSp).putInt("ui_home_sp", c.homeFontSp).putInt("ui_reader_sp", c.readerFontSp).apply()
          AiResidentManager.uiTick++
          }
          @Composable
          fun UiScaleFontSection(ctx: Context, aiCfg: AiRagConfig, ui: ResponsiveUi, onUpdate: (AiRagConfig) -> Unit) {
          Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
          Text("📐 화면 해상도 배율 · 각 부분별 메뉴 & 글자 크기 조절", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)
          Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
          listOf("AUTO" to "자동(해상도맞춤)", "COMPACT" to "컴팩트(작게)", "NORMAL" to "표준", "LARGE" to "크게").forEach { (k, l) -> ChipBtn(l, aiCfg.uiScale == k) { val u = aiCfg.copy(uiScale = k); onUpdate(u); saveAiCfg(ctx, u) } }
          ChipBtn("🔄 크기 초기화", false, CA) { val u = aiCfg.copy(uiScale = "AUTO", menuScalePct = 100, memoFontSp = 14, menuFontSp = 11, homeFontSp = 21, readerFontSp = 18); onUpdate(u); saveAiCfg(ctx, u) }
          }
          Surface(color = Color(0xFF0C1017), shape = RoundedCornerShape(8.dp), border = BorderStroke(1.dp, Color(0xFF263244)), modifier = Modifier.fillMaxWidth()) {
          Column(Modifier.padding(8.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
          Row(Modifier.fillMaxWidth(), SB, CV) { Text("🔘 메뉴·버튼 크기 (${aiCfg.menuScalePct}%)", fontSize = ui.subSp, color = CW); Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) { ChipBtn("작게 -", false) { val u = aiCfg.copy(menuScalePct = (aiCfg.menuScalePct - 5).coerceAtLeast(80)); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("100%", aiCfg.menuScalePct == 100) { val u = aiCfg.copy(menuScalePct = 100); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("크게 +", false) { val u = aiCfg.copy(menuScalePct = (aiCfg.menuScalePct + 5).coerceAtMost(135)); onUpdate(u); saveAiCfg(ctx, u) } } }
          Row(Modifier.fillMaxWidth(), SB, CV) { Text("🏷️ 상단메뉴·탭 글자 (${aiCfg.menuFontSp}pt)", fontSize = ui.subSp, color = CW); Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) { ChipBtn("가 -", false) { val u = aiCfg.copy(menuFontSp = (aiCfg.menuFontSp - 1).coerceAtLeast(9)); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("11pt", aiCfg.menuFontSp == 11) { val u = aiCfg.copy(menuFontSp = 11); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("가 +", false) { val u = aiCfg.copy(menuFontSp = (aiCfg.menuFontSp + 1).coerceAtMost(17)); onUpdate(u); saveAiCfg(ctx, u) } } }
          Row(Modifier.fillMaxWidth(), SB, CV) { Text("📝 메모·AI채팅 글자 (${aiCfg.memoFontSp}pt)", fontSize = ui.subSp, color = CW); Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) { ChipBtn("가 -", false) { val u = aiCfg.copy(memoFontSp = (aiCfg.memoFontSp - 1).coerceAtLeast(11)); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("14pt", aiCfg.memoFontSp == 14) { val u = aiCfg.copy(memoFontSp = 14); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("가 +", false) { val u = aiCfg.copy(memoFontSp = (aiCfg.memoFontSp + 1).coerceAtMost(22)); onUpdate(u); saveAiCfg(ctx, u) } } }
          Row(Modifier.fillMaxWidth(), SB, CV) { Text("🏠 홈 시계·앱목록 글자 (${aiCfg.homeFontSp}pt)", fontSize = ui.subSp, color = CW); Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) { ChipBtn("가 -", false) { val u = aiCfg.copy(homeFontSp = (aiCfg.homeFontSp - 1).coerceAtLeast(15)); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("21pt", aiCfg.homeFontSp == 21) { val u = aiCfg.copy(homeFontSp = 21); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("가 +", false) { val u = aiCfg.copy(homeFontSp = (aiCfg.homeFontSp + 1).coerceAtMost(28)); onUpdate(u); saveAiCfg(ctx, u) } } }
          Row(Modifier.fillMaxWidth(), SB, CV) { Text("📖 독서대(서재) 본문 글자 (${aiCfg.readerFontSp}pt)", fontSize = ui.subSp, color = CW); Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) { ChipBtn("가 -", false) { val u = aiCfg.copy(readerFontSp = (aiCfg.readerFontSp - 1).coerceAtLeast(14)); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("18pt", aiCfg.readerFontSp == 18) { val u = aiCfg.copy(readerFontSp = 18); onUpdate(u); saveAiCfg(ctx, u) }; ChipBtn("가 +", false) { val u = aiCfg.copy(readerFontSp = (aiCfg.readerFontSp + 1).coerceAtMost(30)); onUpdate(u); saveAiCfg(ctx, u) } } }
          }
          }
          }
          }
          '''
              kt = kt[:i1] + new_b + kt[i2:]
              kt = kt.replace('Text("🗂️ 3. RAG 작동 범위 및 임베딩젬마2 옵션"', 'UiScaleFontSection(ctx, aiCfg, ui, onUpdate); Text("🗂️ 3. RAG 작동 범위 및 임베딩젬마2 옵션"', 1)
              open(kf, "w", encoding="utf-8").write(kt)

          mbm_f = "app/src/main/java/app/prolauncher/ai/ModelBundleManager.kt"
          mbm_t = open(mbm_f, encoding="utf-8").read()
          if "fun SmartMemoClassifier.guessCategory" not in mbm_t:
              ext_code = '''
          fun SmartMemoClassifier.guessCategory(text: String, cats: List<String>): String {
          val low = text.lowercase()
          val rules = mapOf("업무" to listOf("회의","미팅","보고서","기획","마감","발표","시안","피드백","출근","거래처","메일","일정","프로젝트","업무"), "할일" to listOf("☐","☑","사기","구매","장보기","우유","원두","마트","택배","청소","세탁","은행","병원","예약","결제","체크"), "독서" to listOf("독서","책","시집","윤동주","김소월","나태주","명상록","인용","발췌","구절","문장","작가","에세이","쪽"), "아이디어" to listOf("아이디어","생각","구상","영감","브레인스토밍","컨셉","기능","디자인","개선"))
          var best = cats.firstOrNull() ?: "일상"; var maxSc = 0
          for (c in cats) { val sc = (rules[c] ?: listOf(c)).count { low.contains(it) }; if (sc > maxSc) { maxSc = sc; best = c } }
          return best
          }
          fun SmartMemoClassifier.categoryOf(n: NoteItem, cats: List<String>): String {
          for (c in cats) if (n.tags.contains(c)) return c
          return n.tags.firstOrNull { it !in listOf("중요","일반","메모","할일") } ?: guessCategory(n.content, cats)
          }
          fun SmartMemoClassifier.toggleCheckLine(n: NoteItem, idx: Int): NoteItem {
          val ls = n.content.lines().toMutableList()
          if (idx in ls.indices) { val l = ls[idx]; ls[idx] = when { l.trimStart().startsWith("☐ ") -> l.replaceFirst("☐ ", "☑ "); l.trimStart().startsWith("☑ ") -> l.replaceFirst("☑ ", "☐ "); else -> l } }
          return n.copy(content = ls.joinToString("\\n"))
          }
          fun SmartMemoClassifier.summarizeByLength(raw: String, force: Boolean = false): String {
          val clean = raw.lines().map { it.replace(Regex("#[^\\\\s#]+"), "").replace("☐", "").replace("☑", "").replace("•", "").trim() }.filter { it.isNotEmpty() }
          val chars = clean.sumOf { it.length }
          if (!force && clean.size <= 2 && chars < 75) return ""
          val sents = raw.replace("\\n", ". ").split(Regex("[.!?]+")).map { it.replace(Regex("#[^\\\\s#]+"), "").replace("☐", "").replace("☑", "").trim() }.filter { it.length >= 4 }
          if (sents.size <= 1 && chars < 75) return if (force) "1~2줄 이내의 짧은 메모는 요약 없이 원문 그대로 표시됩니다." else ""
          val target = when { chars < 160 && sents.size <= 3 -> 1; chars < 320 && sents.size <= 6 -> 2; else -> 3 }
          return sents.mapIndexed { i, s -> Triple(i, s, (if (i == 0) 4 else 0) + (s.length.coerceAtMost(45) / 10)) }.sortedByDescending { it.third }.take(target).sortedBy { it.first }.joinToString("\\n") { (_, s, _) -> val cut = if (s.length > 46) s.take(46) + "…" else s; if (target == 1) cut else "• $cut" }
          }
          '''
              open(mbm_f, "w", encoding="utf-8").write(mbm_t + "\n" + ext_code)

          sf = "app/src/main/java/app/prolauncher/ai/Screens.kt"
          st = open(sf, encoding="utf-8").read()
          st = st.replace("var aiCfg by remember { mutableStateOf(loadAiCfg(ctx)) }", "val tick = AiResidentManager.uiTick; var aiCfg by remember(tick) { mutableStateOf(loadAiCfg(ctx)) }", 1)
          st = st.replace("var aiPromptCfgOpen by remember { mutableStateOf(false) }", "var aiPromptCfgOpen by remember { mutableStateOf(true) }", 1)
          st = st.replace('"✅ LLM 챗봇 + 전체 메모 RAG 엔진 활성"', "AiResidentManager.statusSummary()", 1)
          if "UiScaleFontSection(" not in st:
              st = st.replace('Text("1. 화면 해상도 배율 설정"', 'UiScaleFontSection(ctx, aiCfg, ui) { aiCfg = it }; Text("1. 화면 해상도 배율 설정"', 1)
          open(sf, "w", encoding="utf-8").write(st)
          PYEOF
          python3 /tmp/prep.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
