          ma = ma.replace("super.onCreate(savedInstanceState)", "super.onCreate(savedInstanceState); val prevEh = Thread.getDefaultUncaughtExceptionHandler(); Thread.setDefaultUncaughtExceptionHandler { th, ex -> if (th.name != \"main\") { ex.printStackTrace() } else { prevEh?.uncaughtException(th, ex) } }")
          ma = ma.replace("pageCount = { 3 }", "pageCount = { 4 }")
          ma = ma.replace("onSaveNotes = { notes = it; repo.saveNotes(it) }, onSaveTodos = { todos = it; repo.saveTodos(it) })", "onSaveNotes = { notes = it; repo.saveNotes(it) }, onSaveTodos = { todos = it; repo.saveTodos(it) }, isAiPage = false)\n3 -> NotesRagView(notes, todos, books, cfg, ai, null, onClearQuote = {}, onSaveNotes = { notes = it; repo.saveNotes(it) }, onSaveTodos = { todos = it; repo.saveTodos(it) }, isAiPage = true)")
          ma = ma.replace("메모 · AI · 검색 →", "메모장 →  |  AI·세팅(2번) →→")
          open(maf, "w").write(ma)
          mf = "app/src/main/AndroidManifest.xml"; m = open(mf).read()
