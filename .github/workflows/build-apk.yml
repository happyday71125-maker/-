name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Permanent Debug Keystore (No Conflict on Update)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1

      - name: Prepare Fixed Signing Key & Clean Sources
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -noprompt -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" < /dev/null
          fi
          cp ~/.android/debug.keystore app/fixed.keystore
          sed -i -E 's/ui\.(subSp|bodySp|titleSp) \+ ([0-9]+)\.sp/(ui.\1.value + \2).sp/g' app/src/main/java/app/prolauncher/ai/*.kt
          python3 -c '
          import glob
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          lines = open(kf, encoding="utf-8").read().splitlines()
          cut_idx = len(lines)
          for i in range(1, len(lines)):
              if lines[i].strip().startswith("import ") and any("object " in l or "fun " in l for l in lines[:i]):
                  cut_idx = i
                  break
          cl = lines[:cut_idx]
          txt = "\n".join(cl).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "")
          o, c = txt.count("{"), txt.count("}")
          if o > c:
              txt += "\n" + ("}\n" * (o - c))
          elif c > o:
              while c > o and cl and cl[-1].strip() == "}":
                  cl.pop()
                  c -= 1
              txt = "\n".join(cl)
          open(kf, "w", encoding="utf-8").write(txt)
          '

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
