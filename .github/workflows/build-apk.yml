name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Persistent Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1
      - name: Upgrade v9.4 Engine
        run: |
          python3 -c 'import sys; exec(sys.stdin.read())' << 'PYEOF'
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.isfile(kp): shutil.copy(kp, "app/fixed.keystore")
          lf = "app/src/main/java/app/prolauncher/ai/LocalAiNoteEngine.kt"; lt = open(lf).read()
          lt = re.sub(r"\.set(Temperature|TopK|TopP|RandomSeed)\([^)]*\)", "", lt)
          lt = re.sub(r"LlmInference\.createFromOptions\([^)]+\)", "(null as LlmInference?)", lt)
          open(lf, "w").write(lt)
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw_kf = open(kf).read()
          p = raw_kf.split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "") if len(p) > 1 else ""
          kept = ((p[0] + "import android.app.*" + cand) if len(p) > 1 else raw_kf).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = t.replace("package app.prolauncher.ai", "package app.prolauncher.ai\nimport com.google.mediapipe.tasks.genai.llminference.*\nimport com.google.mediapipe.tasks.genai.llminference.LlmInferenceSession.*")
          t = re.sub(r"\.set(Temperature|TopK|TopP|RandomSeed)\([^)]*\)", "", t)
          t = re.sub(r"LlmInference\.createFromOptions\([^)]+\)", "(null as LlmInference?)", t)
          t = re.sub(r"\.channel\.map\(([^,]+),\s*0L?,\s*([^)]+)\)", r".channel.map(\1, 0L, minOf(33554432L, (\2).toLong()))", t)
          t = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { appCtxRef = ctx.applicationContext; releaseAllLocalModels(); runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; gemmaName = \"미연결\"; embedName = \"미연결\"; var b = 0L; listOf(\"models\", \"llm_models\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \"🗑️ 로컬 AI(.gguf/.litertlm) · 임베딩 비우기 완료 (\" + (b/1048576L) + \"MB 확보)\" }\nfun startService(ctx: Context) = runCatching { appCtxRef = ctx.applicationContext; if (true) return@runCatching Unit;")
          t = t.replace("fun loadAiCfg(ctx: Context): AiRagConfig {", "fun loadAiCfg(ctx: Context): AiRagConfig {\nappCtxRef = ctx.applicationContext; val sp0 = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0); thinkOn = sp0.getBoolean(\"ai_think_on\", false); streamOn = sp0.getBoolean(\"ai_stream_on\", true); refreshDetectedModelNames()")
          t = t.replace("val uiScale: String = \"AUTO\")", "val uiScale: String = \"AUTO\", val apiUrl: String = \"local_gguf\", val apiModel: String = \"\", val apiKey: String = \"\", val temp: Float = 0.5f)")
          t = t.replace("p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\")", "p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\", p.getString(\"ai_host_url\", \"local_gguf\")?.ifBlank { \"local_gguf\" } ?: \"local_gguf\", p.getString(\"ai_host_model\", \"\") ?: \"\", p.getString(\"ai_host_key\", \"\") ?: \"\", p.getFloat(\"ai_temp\", 0.5f))")
          t = t.replace(".putString(\"ui_scale_mode\", c.uiScale).apply()", ".putString(\"ui_scale_mode\", c.uiScale).putString(\"ai_host_url\", c.apiUrl.trim()).putString(\"ai_host_model\", c.apiModel.trim()).putString(\"ai_host_key\", c.apiKey.trim()).putFloat(\"ai_temp\", c.temp).apply()")
