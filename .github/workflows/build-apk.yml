          "fun getApi(u: String, k: String = \"\"): String = runCatching {\n(URL(u).openConnection() as HttpURLConnection).apply { connectTimeout = 4000; readTimeout = 5000; setRequestProperty(\"User-Agent\", \"Mozilla/5.0\"); if (k.isNotBlank()) setRequestProperty(\"Authorization\", \"Bearer \" + k.trim()) }.inputStream.bufferedReader().use { it.readText() }\n}.getOrDefault(\"\")\nfun discoverServerModel(base: String, k: String): String {\nfor (ep in listOf(\"$base/api/tags\", \"$base/v1/models\", \"$base/models\")) {\nval s = getApi(ep, k); if (s.isNotEmpty()) runCatching {\nval j = JSONObject(s); val m = j.optJSONArray(\"models\")",
          "if (m != null && m.length() > 0) m.getJSONObject(0).optString(\"name\", m.getJSONObject(0).optString(\"model\", \"\")).trim().takeIf { it.isNotEmpty() }?.let { return it }\nval d = j.optJSONArray(\"data\")\nif (d != null && d.length() > 0) d.getJSONObject(0).optString(\"id\", \"\").trim().takeIf { it.isNotEmpty() }?.let { return it }\n}\n}\nreturn \"\"\n}\nfun wikiAns(userMsg: String, ragCtx: String): String {\nval q = userMsg.trim()\nval kw = q.replace(Regex(\"[^가-힣a-zA-Z0-9 ]\"), \" \").trim().split(Regex(\"\\\\s+\")).map { it.replace(Regex(\"(이란|란|은|는|이|가|을|를|의|에|대해|에서|무엇|뭔가요|알려줘|설명해줘|뭐야|어떤|나라야|나라)$\"), \"\") }.filter { it.length >= 2 }.lastOrNull() ?: q",
          "val sb = StringBuilder(); if (ragCtx.isNotBlank()) sb.append(\"📌 [내 메모 검색 결과]\\n$ragCtx\\n\\n\")\nfor (lang in listOf(\"ko\", \"en\")) {\nval enc = URLEncoder.encode(kw.ifEmpty { q }, \"UTF-8\")\nval r1 = getApi(\"https\" + \"://$lang.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&format=json&titles=$enc\")\nif (r1.isNotEmpty()) runCatching {\nval pages = JSONObject(r1).optJSONObject(\"query\")?.optJSONObject(\"pages\")",
          "if (pages != null) { val ks = pages.keys(); while (ks.hasNext()) { val ext = pages.optJSONObject(ks.next().toString())?.optString(\"extract\", \"\")?.trim() ?: \"\"; if (ext.isNotEmpty()) { sb.append(ext.take(700)); return sb.toString() } } }\n}\n}\nreturn if (sb.isNotEmpty()) sb.toString() else \"⚠️ 답변을 불러오지 못했습니다. [⚙️ AI 세팅]에서 Ollama 또는 로컬 GGUF 모델을 확인해 주세요.\"\n}\nfun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String, apiUrl: String = \"\", apiModel: String = \"\", apiKey: String = \"\"): String? {\nval fullSys = if (ragCtx.isBlank()) sysPrompt else \"$sysPrompt\\n\\n[참고 메모]\\n$ragCtx\"",
          "val combP = if (fullSys.isNotBlank()) \"$fullSys\\n\\n질문: $userMsg\" else userMsg\nAiResidentManager.gemmaLlm?.let { llm -> runCatching { llm.generateResponse(combP)?.trim()?.takeIf { it.isNotEmpty() } }?.getOrNull()?.let { return it } }\nvar rawU = apiUrl.trim(); var k = apiKey.trim(); val m = apiModel.trim()\nif (rawU == \"local_gguf\" || rawU.isBlank()) return wikiAns(userMsg, ragCtx)\nif (!rawU.startsWith(\"http\" + \"://\") && !rawU.startsWith(\"https\" + \"://\")) rawU = \"http\" + \"://$rawU\"\nval cleanU = rawU.removeSuffix(\"/\")",
          "val base = cleanU.removeSuffix(\"/v1/chat/completions\").removeSuffix(\"/chat/completions\").removeSuffix(\"/v1/completions\").removeSuffix(\"/completion\").removeSuffix(\"/api/chat\").removeSuffix(\"/api/generate\").removeSuffix(\"/v1\").removeSuffix(\"/\")\nval discMod = discoverServerModel(base, k)\nval mods = mutableListOf<String>().apply {\nif (discMod.isNotEmpty()) add(discMod)\nif (m.isNotEmpty() && !contains(m)) add(m)\nval gn = AiResidentManager.gemmaName\nif (gn.isNotBlank() && !gn.contains(\"미연결\") && !contains(gn)) { add(gn); if (gn.endsWith(\".gguf\", true)) add(gn.substringBeforeLast(\".\")) }\nif (isEmpty()) add(\"gemma3:1b\")",
          "if (!contains(\"default\")) add(\"default\")\nif (!contains(\"\")) add(\"\")\n}\nvar lastCode = 0; var lastErr = \"\"\nfor (ep in linkedSetOf(\"$base/api/chat\", \"$base/v1/chat/completions\", cleanU)) {\nfor (mod in mods) {\nval b1 = JSONObject().apply { if (mod.isNotEmpty()) put(\"model\", mod); put(\"stream\", false); put(\"messages\", JSONArray().put(JSONObject().put(\"role\", \"user\").put(\"content\", combP))) }\nval (c1, r1) = postApi(ep, k, b1); parseAns(r1)?.let { return it }; lastCode = c1; lastErr = r1; if (c1 == -1) break",
          "val b2 = JSONObject().apply { if (mod.isNotEmpty()) put(\"model\", mod); put(\"stream\", false); put(\"messages\", JSONArray().put(JSONObject().put(\"role\", \"system\").put(\"content\", fullSys)).put(JSONObject().put(\"role\", \"user\").put(\"content\", userMsg))) }\nval (c2, r2) = postApi(ep, k, b2); parseAns(r2)?.let { return it }; if (c2 != 404) { lastCode = c2; lastErr = r2 }\n}\n}\nfor (ep in listOf(\"$base/api/generate\", \"$base/completion\", \"$base/v1/completions\")) {\nval tm = if (discMod.isNotEmpty()) discMod else m",
          "val b3 = JSONObject().apply { if (tm.isNotEmpty()) put(\"model\", tm); put(\"prompt\", \"<start_of_turn>user\\n$combP<end_of_turn>\\n<start_of_turn>model\\n\"); put(\"stream\", false); put(\"n_predict\", 512) }\nval (c3, r3) = postApi(ep, k, b3); parseAns(r3)?.let { return it }; if (c3 == -1) break; if (c3 != 404) { lastCode = c3; lastErr = r3 }\n}\nif (AiResidentManager.gemmaMb > 0L) return wikiAns(userMsg, ragCtx)\nval errMsg = lastErr.replace(\"\\n\", \" \").take(90)\nreturn if (lastCode == -1) \"⚠️ Ollama / 로컬 서버($base)에 연결할 수 없습니다. Ollama 앱이나 로컬 GGUF 모델을 확인해 주세요.\"",
          "else \"⚠️ Ollama / API 오류 (HTTP $lastCode\" + (if (discMod.isNotEmpty()) \", 감지모델: $discMod\" else \"\") + \"): \" + errMsg.ifBlank { \"모델 미로드\" } + \"\"\n}"
          ])
