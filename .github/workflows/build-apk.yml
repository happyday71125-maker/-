          python3 -c '
          import base64, lzma, re
          raw_b64 = "".join(open("/tmp/patch80.b64").read().split())
          sec_a, sec_b, sec_c, sec_d = lzma.decompress(base64.b64decode(raw_b64)).decode("utf-8").split("===SPLIT===")

          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          lines = open(kf, encoding="utf-8").read().splitlines()
          cut_idx = len(lines)
          for i in range(1, len(lines)):
              if lines[i].strip().startswith("import ") and any("object " in l or "fun " in l for l in lines[:i]):
                  cut_idx = i
                  break
          txt = "\n".join(lines[:cut_idx])
          txt = txt.replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "")
          txt = txt.replace("var serviceAlive = false", "var serviceAlive = true").replace("var heartbeats = 0", "var heartbeats = 1")
          txt = txt[:txt.index("fun statusSummary(): String {")] + sec_a + txt[txt.index("private fun loadEmbedFile("):]
          txt = txt[:txt.index("suspend fun runSelfTest(")] + sec_b + txt[txt.index("class AiResidentService"):]
          txt = txt[:txt.index("data class AiRagConfig(")] + sec_c + txt[txt.index("@Composable\nfun UiScaleFontSection"):]
          txt = txt[:txt.index("data class ChatMsg(")] + sec_d
          open(kf, "w", encoding="utf-8").write(txt)

          mf = "app/src/main/AndroidManifest.xml"
          m = open(mf, encoding="utf-8").read()
          for perm in ["FOREGROUND_SERVICE", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "READ_EXTERNAL_STORAGE"]:
              if perm not in m:
                  m = m.replace("<application", f"<uses-permission android:name=\"android.permission.{perm}\" />\n    <application", 1)
          if "largeHeap" not in m:
              m = m.replace("<application", "<application android:largeHeap=\"true\"", 1)
          if "usesCleartextTraffic" not in m:
              m = m.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
          if "AiResidentService" not in m:
              m = m.replace("</application>", "    <service android:name=\".AiResidentService\" android:enabled=\"true\" android:exported=\"false\" />\n    </application>", 1)
          m = m.replace("android:launchMode=\"singleTask\"", "android:launchMode=\"singleTop\"").replace("android:clearTaskOnLaunch=\"true\"", "").replace("android:excludeFromRecents=\"true\"", "")
          open(mf, "w", encoding="utf-8").write(m)

          gf = "app/build.gradle.kts"
          g = open(gf, encoding="utf-8").read()
          g = g.replace("0.10.14", "0.10.21").replace("0.10.22", "0.10.21")
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 2${{ github.run_number }}", g)
          g = re.sub(r"versionName\s*=\s*\"[^\"]+\"", "versionName = \"8.0.${{ github.run_number }}\"", g)
          if "fixed.keystore" not in g:
              sc = "    signingConfigs {\n        getByName(\"debug\") {\n            storeFile = file(\"fixed.keystore\")\n            storePassword = \"android\"\n            keyAlias = \"androiddebugkey\"\n            keyPassword = \"android\"\n        }\n    }\n    buildFeatures {"
              g = g.replace("buildFeatures {", sc, 1)
          open(gf, "w", encoding="utf-8").write(g)

          sf = "app/src/main/java/app/prolauncher/ai/Screens.kt"
          s = open(sf, encoding="utf-8").read()
          s = s.replace("var aiPromptCfgOpen by remember { mutableStateOf(false) }", "var aiPromptCfgOpen by remember { mutableStateOf(true) }")
          s = s.replace("var aiMsg by remember { mutableStateOf<String?>(null) }", "var aiMsg by remember { mutableStateOf<String?>(AiResidentManager.statusSummary()) }")
          s = s.replace("var aiCfg by remember { mutableStateOf(loadAiCfg(ctx)) }", "var aiCfg by remember(AiResidentManager.uiTick) { mutableStateOf(loadAiCfg(ctx)) }")
          s = s.replace("Text(\"✅ LLM 챗봇 + 전체 메모 RAG 엔진 활성\", fontSize = ui.subSp, color = CG)", "Text(\"🔒 ${AiResidentManager.statusSummary()}\", fontSize = ui.subSp, color = CG)")
          if "UiScaleFontSection(ctx, aiCfg, ui)" not in s:
              s = s.replace("Text(\"🛠️ 메모 작성 툴바 버튼 표시 설정\",", "UiScaleFontSection(ctx, aiCfg, ui) { aiCfg = it }; Text(\"🛠️ 메모 작성 툴바 버튼 표시 설정\",")
          open(sf, "w", encoding="utf-8").write(s)
          '
          sed -i -E 's/ui\.(subSp|bodySp|titleSp) \+ ([0-9]+)\.sp/(ui.\1.value + \2).sp/g' app/src/main/java/app/prolauncher/ai/*.kt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProLauncherAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
