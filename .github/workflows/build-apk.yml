"P_29": "suspend fun buildRagContextSmart(q: String, aiCfg: AiRagConfig, notes: List<NoteItem>, books: List<BookItem>, cats: List<String>): String { if (notes.isEmpty() && (!aiCfg.ragBooks || books.isEmpty())) return ZqZq; val baseNotes = if (aiCfg.ragImpOnly) notes.filter { SmartMemoClassifier.isImportant(it) } else notes; val kws = q.lowercase().split(Zq Zq).filter { it.length >= 2 }; val qCho = KoreanChosungMatcher.extractChosung(q.lowercase()); val qVec = embedWithGguf(q, true); val scored = baseNotes.map { n -> val cat = SmartMemoClassifier.categoryOf(n, cats); val lex = kws.count { k -> n.content.contains(k, true) || cat.contains(k, true) } * 0.16f; val cho = if (qCho.length >= 2 && KoreanChosungMatcher.extractChosung(n.content).contains(qCho)) 0.12f else 0f; val sem = if (qVec != null) (embedWithGguf(n.content, false, cat)?.let { dotCos(qVec, it) } ?: 0f) else 0f; n to (sem + lex + cho) }.sortedByDescending { it.second }; val targetNotes = scored.take(if (aiCfg.ragScope == ZqALLZq) 8 else aiCfg.ragTopK.coerceIn(1, 10)); return buildString { val embTag = if (qVec != null) ZqEmbeddingGemma2 GGUF 벡터Zq else Zq초성·키워드 하이브리드Zq; append(Zq총 메모 ${notes.size}건 중 [$embTag] 상위 참조 (${targetNotes.size}건):ZbbnZq); targetNotes.forEachIndexed { idx, (n, sc) -> append(Zq${idx + 1}. [${SmartMemoClassifier.categoryOf(n, cats)} · ${n.createdAt}] ${n.content.replace(ZqZbbnZq, Zq / Zq).take(220)}ZbbnZq) } }.trim() }Zbn",
