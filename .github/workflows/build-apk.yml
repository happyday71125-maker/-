name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prolauncher-ai-permanent-keystore-v1
      - name: Upgrade v9.0 Engine
        run: |
          python3 -c 'exec(chr(10).join(x.strip() for x in """
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.isfile(kp): shutil.copy(kp, "app/fixed.keystore")
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          raw_kf = open(kf).read()
          p = raw_kf.split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "") if len(p) > 1 else ""
          kept = ((p[0] + "import android.app.*" + cand) if len(p) > 1 else raw_kf).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "~B~n".join(kept) + ("~B~n}" * max(0, oc - cc))
          t = re.sub(r"LlmInference~B~.createFromOptions~B~([^)]+~B~)", r"runCatching { ~B~g<0> }.getOrNull()", t)
          t = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { appCtxRef = ctx.applicationContext; releaseGguf(); runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; gemmaName = `미연결`; embedName = `미연결`; var b = 0L; listOf(`models`, `llm_models`).forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return `🗑️ 로컬 GGUF · 임베딩 비우기 완료 (` + (b/1048576L) + `MB 확보)` }~B~nfun startService(ctx: Context) = runCatching { appCtxRef = ctx.applicationContext;")
          t = t.replace("fun loadAiCfg(ctx: Context): AiRagConfig {", "fun loadAiCfg(ctx: Context): AiRagConfig {~B~nappCtxRef = ctx.applicationContext")
          t = t.replace("val uiScale: String = `AUTO`)", "val uiScale: String = `AUTO`, val apiUrl: String = `local_gguf`, val apiModel: String = ``, val apiKey: String = ``, val temp: Float = 0.5f)")
          t = t.replace("p.getString(`ui_scale_mode`, `AUTO`) ?: `AUTO`)", "p.getString(`ui_scale_mode`, `AUTO`) ?: `AUTO`, p.getString(`ai_host_url`, `local_gguf`)?.ifBlank { `local_gguf` } ?: `local_gguf`, p.getString(`ai_host_model`, ``) ?: ``, p.getString(`ai_host_key`, ``) ?: ``, p.getFloat(`ai_temp`, 0.5f))")
          t = t.replace(".putString(`ui_scale_mode`, c.uiScale).apply()", ".putString(`ui_scale_mode`, c.uiScale).putString(`ai_host_url`, c.apiUrl.trim()).putString(`ai_host_model`, c.apiModel.trim()).putString(`ai_host_key`, c.apiKey.trim()).putFloat(`ai_temp`, c.temp).apply()")
          new_http = "~B~n".join([
          "var appCtxRef: Context? = null~B~nvar sharedAiChatIn by mutableStateOf(``)~B~nvar lastEngineUsed by mutableStateOf(`🧠 로컬 GGUF`)~B~nvar ggufRunner: (suspend (String, String, Int) -> String)? = null~B~nvar ggufDropper: (suspend () -> Unit)? = null~B~nvar ggufLoadedPath: String = ``~B~nvar ggufLastStatus: String = `대기중`~B~nfun copyMemoToAi(txt: String) {~B~nval blk = txt.trim() + `~B~~B~n────────────~B~~B~n`~B~nsharedAiChatIn = if (sharedAiChatIn.isBlank()) blk else sharedAiChatIn.trimEnd() + `~B~~B~n` + blk~B~n}",
          "fun copyToClip(ctx: Context, txt: String) = runCatching {~B~n(ctx.getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager).setPrimaryClip(android.content.ClipData.newPlainText(`memo`, txt))~B~n}~B~nfun makeHashtags(raw: String, cat: String): String {~B~nval ls = raw.trim().lines().dropLastWhile { ln -> ln.trim().let { it.isNotEmpty() && it.split(Regex(`~B~~B~~B~~B~s+`)).all { w -> w.startsWith(`#`) } } }~B~nval body = ls.joinToString(`~B~~B~n`).trim()",
          "val stop = setOf(`오늘`,`내일`,`지금`,`그냥`,`정말`,`너무`,`그리고`,`하지만`,`그래서`,`위해`,`대한`,`통해`,`관련`,`하기`,`있는`,`없는`,`입니다`,`합니다`,`완료`,`정리`,`메모`,`할일`,`일상`,`항목`)~B~nval wds = body.replace(Regex(`[^가-힣a-zA-Z0-9~B~~B~~B~~B~s]`), ` `).split(Regex(`~B~~B~~B~~B~s+`)).map {~B~nit.replace(Regex(`(은|는|이|가|을|를|의|에|에서|으로|로|과|와|도|만|까지|부터|하고|하며|이라|이다|입니다|합니다|해서|해야|했던|하는)$`), ``)~B~n}.filter { it.length in 2..10 && !it.all { c -> c.isDigit() } && it !in stop }.distinct().take(5)",
          "val tags = (listOf(cat) + wds).map { `#` + it.replace(`#`, ``).trim() }.filter { it.length > 1 }.distinct().take(6).joinToString(` `)~B~nreturn if (body.isEmpty()) tags else `$body~B~~B~n~B~~B~n$tags`~B~n}~B~nfun isGgufFile(f: java.io.File): Boolean = f.isFile && f.length() > 1048576L && (f.name.endsWith(`.gguf`, true) || runCatching { val b = ByteArray(4); java.io.FileInputStream(f).use { it.read(b) == 4 && String(b, Charsets.US_ASCII) == `GGUF` } }.getOrDefault(false))",
          "fun findLocalGguf(): java.io.File? {~B~nval base = appCtxRef?.filesDir ?: java.io.File(`/data/data/app.prolauncher.ai.v3/files`)~B~nfor (d in listOf(java.io.File(base, `llm_models`), java.io.File(base, `models`), base)) {~B~nd.listFiles()?.filter { isGgufFile(it) }?.maxByOrNull { it.lastModified() }?.let { return it }~B~n}~B~nreturn null~B~n}~B~nfun releaseGguf() {~B~nval d = ggufDropper; ggufRunner = null; ggufDropper = null; ggufLoadedPath = ``",
          "if (d != null) kotlinx.coroutines.runBlocking { runCatching { d.invoke() } }~B~n}~B~nfun cleanThink(s: String): String = s.replace(Regex(`<think>[~B~~B~~B~~B~s~B~~B~~B~~B~S]*?</think>`), ``).trim().ifBlank { s.replace(`<think>`, ``).replace(`</think>`, ``).trim() }~B~nsuspend fun runLocalGguf(f: java.io.File, sysPrompt: String, history: List<ChatMsg>, userMsg: String): String? = runCatching {~B~nval path = f.absolutePath~B~nif (ggufRunner == null || ggufLoadedPath != path) {~B~nggufDropper?.invoke()",
          "runCatching { AiResidentManager.gemmaLlm?.close(); AiResidentManager.gemmaLlm = null; AiResidentManager.gemmaBuf = null; if (AiResidentManager.embedder == null) AiResidentManager.embedBuf = null }~B~nSystem.gc()",
          "val mdl = try { dev.ffmpegkit.llama.Llama.loadModel(modelPath = path, config = dev.ffmpegkit.llama.LlamaConfig(contextSize = 2048, threads = 4)) } catch (t1: Throwable) { dev.ffmpegkit.llama.Llama.loadModel(modelPath = path, config = dev.ffmpegkit.llama.LlamaConfig(contextSize = 1024, threads = 4)) }~B~nggufLoadedPath = path~B~nggufRunner = { p, s, mx -> dev.ffmpegkit.llama.Llama.complete(mdl, prompt = p, systemPrompt = s, maxTokens = mx).text }",
          "ggufDropper = { runCatching { dev.ffmpegkit.llama.Llama.releaseModel(mdl) } }~B~n}~B~nval hist = history.takeLast(4).joinToString(`~B~~B~n`) { (if (it.isUser) `User: ` else `AI: `) + it.text.take(140) }~B~nval fullS = (if (hist.isBlank()) sysPrompt else `$sysPrompt~B~~B~n~B~~B~n[이전 대화]~B~~B~n$hist`) + `~B~~B~n반드시 한국어로 핵심만 간결하게 답변하세요.`~B~nval ans = cleanThink(ggufRunner?.invoke(userMsg, fullS, 512)?.trim() ?: ``).takeIf { it.isNotBlank() }",
          "if (ans != null) { ggufLastStatus = `정상`; lastEngineUsed = `🧠 로컬 GGUF (` + f.name.take(14) + `)` }~B~nans~B~n}.onFailure { e -> ggufLastStatus = (e.message ?: e.javaClass.simpleName).take(40); ggufRunner = null; ggufDropper = null; ggufLoadedPath = `` }.getOrNull()~B~nsuspend fun verifyLocalAiAndRag(aiCfg: AiRagConfig): String {~B~nval gf = findLocalGguf()~B~nval ragSt = if (aiCfg.ragOn) `ON (` + (if (aiCfg.ragScope == `ALL`) `전체메모` else `상위` + aiCfg.ragTopK + `건`) + `)` else `OFF (일반대화·메모미참조)`",
          "val embSt = if (AiResidentManager.embedder != null) `임베딩모델 활성` else `초성·키워드RAG 활성`~B~nif (gf == null) return `⚠️ 로컬 GGUF 미감지 (📂 로컬 AI 올리기 필요) | RAG: ` + ragSt + ` · ` + embSt~B~nval mb = gf.length() / 1048576L~B~nval r = runLocalGguf(gf, `한국어로 짧게 인사하세요.`, emptyList(), `안녕`)~B~nreturn if (!r.isNullOrBlank()) `✅ 로컬 GGUF 정상 작동! [` + gf.name.take(18) + ` · ` + mb + `MB] (응답: ` + r.replace(`~B~~B~n`, ` `).take(18) + `) | RAG: ` + ragSt + ` · ` + embSt",
          "else `⚠️ GGUF 점검 필요 (` + ggufLastStatus + `) | RAG: ` + ragSt~B~n}~B~nfun parseAns(r: String): String? = r.trim().takeIf { it.isNotEmpty() && !it.startsWith(`<!DOCTYPE`, true) && !it.startsWith(`<html`, true) }?.let { s ->~B~nval raw = if (!s.startsWith(`~B~~B~u007B`)) s else runCatching {~B~nval o = JSONObject(s); val c0 = o.optJSONArray(`choices`)?.optJSONObject(0); val m0 = c0?.optJSONObject(`message`)",
          "(m0?.optString(`content`)?.takeIf { it.isNotBlank() } ?: m0?.optString(`reasoning_content`)?.takeIf { it.isNotBlank() } ?: c0?.optString(`text`)?.takeIf { it.isNotBlank() } ?: o.optJSONArray(`candidates`)?.optJSONObject(0)?.optJSONObject(`content`)?.optJSONArray(`parts`)?.optString(`text`)?.takeIf { it.isNotBlank() } ?: o.optJSONObject(`message`)?.optString(`content`)?.takeIf { it.isNotBlank() } ?: o.optString(`response`).takeIf { it.isNotBlank() } ?: o.optString(`content`).takeIf { it.isNotBlank() })?.trim()",
          "}.getOrNull()~B~nraw?.let { cleanThink(it) }?.takeIf { it.isNotBlank() }~B~n}~B~nfun postApi(u: String, k: String, body: JSONObject, tOut: Int = 25000): Pair<Int, String> {~B~nvar c: HttpURLConnection? = null~B~nreturn try {",
          "c = (URL(u).openConnection() as HttpURLConnection).apply { requestMethod = `POST`; connectTimeout = 4000; readTimeout = tOut; doOutput = true; setRequestProperty(`Content-Type`, `application/json; charset=UTF-8`); setRequestProperty(`User-Agent`, `Mozilla/5.0`); if (k.isNotBlank()) setRequestProperty(`Authorization`, `Bearer ` + k.trim()) }~B~nOutputStreamWriter(c.outputStream, Charsets.UTF_8).use { it.write(body.toString()) }~B~nval code = c.responseCode",
          "code to ((if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ``)~B~n} catch (e: Exception) { -1 to `` } finally { c?.disconnect() }~B~n}~B~nfun getApi(u: String, k: String = ``): String = runCatching {",
          "(URL(u).openConnection() as HttpURLConnection).apply { connectTimeout = 3000; readTimeout = 4000; setRequestProperty(`User-Agent`, `Mozilla/5.0`); if (k.isNotBlank()) setRequestProperty(`Authorization`, `Bearer ` + k.trim()) }.inputStream.bufferedReader().use { it.readText() }~B~n}.getOrDefault(``)~B~nfun discoverServerModel(base: String, k: String): String {~B~nfor (ep in listOf(`$base/api/tags`, `$base/v1/models`)) {~B~nval s = getApi(ep, k); if (s.isNotEmpty()) runCatching {",
          "val j = JSONObject(s)~B~nj.optJSONArray(`models`)?.optJSONObject(0)?.let { return it.optString(`name`, it.optString(`model`, ``)).trim() }~B~nj.optJSONArray(`data`)?.optJSONObject(0)?.optString(`id`, ``)?.trim()?.takeIf { it.isNotEmpty() }?.let { return it }~B~n}~B~n}~B~nreturn ``~B~n}~B~nfun fallbackLlmOrChat(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String): String {~B~nval fullSys = if (ragCtx.isBlank()) sysPrompt else `$sysPrompt~B~~B~n~B~~B~n[참고 메모]~B~~B~n$ragCtx`",
          "val msgs = JSONArray().apply {~B~nput(JSONObject().put(`role`, `system`).put(`content`, fullSys))~B~nhistory.takeLast(4).forEach { m -> put(JSONObject().put(`role`, if (m.isUser) `user` else `assistant`).put(`content`, m.text.take(200))) }~B~nput(JSONObject().put(`role`, `user`).put(`content`, userMsg))~B~n}~B~nfor (ep in listOf(`https` + `://text.pollinations.ai/openai`, `https` + `://text.pollinations.ai/`)) {",
          "parseAns(postApi(ep, ``, JSONObject().put(`messages`, msgs).put(`model`, `openai`).put(`seed`, 42), 14000).second)?.let { lastEngineUsed = `🌐 온라인 AI`; return it }~B~n}~B~nlastEngineUsed = `🤖 내장 오프라인 엔진`~B~nval q = userMsg.trim()~B~nif (q.length <= 10 && (q.contains(`안녕`) || q.contains(`ㅎㅇ`) || q.contains(`하이`) || q.contains(`반가`) || q.contains(`테스트`))) {~B~nval gn = AiResidentManager.gemmaName.takeIf { !it.contains(`미연결`) } ?: `GGUF`~B~nreturn `안녕하세요! 🦙 로컬 AI ($gn) 챗봇입니다. 무엇이든 편하게 질문해 주세요!`~B~n}",
          "val kw = q.replace(Regex(`(이란|란|은|는|이|가|을|를|의|에|대해|알려줘|뭐야|어떤|나라야|[?？.!])+`), ` `).trim().split(` `).lastOrNull { it.length >= 2 } ?: q~B~nval r1 = getApi(`https` + `://ko.wikipedia.org/api/rest_v1/page/summary/` + URLEncoder.encode(kw.ifEmpty { q }, `UTF-8`))~B~nif (r1.isNotEmpty()) runCatching {~B~nval ex = JSONObject(r1).optString(`extract`, ``).trim()",
          "if (ex.isNotEmpty() && !ex.contains(`자두야`) && !ex.contains(`절망선생`)) return (if (ragCtx.isNotBlank()) `📌 [메모 참조]~B~~B~n$ragCtx~B~~B~n~B~~B~n` else ``) + ex.take(700)~B~n}~B~nreturn if (ragCtx.isNotBlank()) `📌 [내 메모 RAG 분석 결과]~B~~B~n$ragCtx` else `안녕하세요! [⚙️ AI 세팅]에서 로컬 AI (GGUF) 파일을 올려주시면 오프라인에서도 단독으로 답변합니다.`~B~n}~B~nsuspend fun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String, apiUrl: String = ``, apiModel: String = ``, apiKey: String = ``): String? {",
          "val fullSys = if (ragCtx.isBlank()) sysPrompt else `$sysPrompt~B~~B~n~B~~B~n[참고 메모]~B~~B~n$ragCtx`~B~nval combP = if (fullSys.isNotBlank()) `$fullSys~B~~B~n~B~~B~n질문: $userMsg` else userMsg~B~nfindLocalGguf()?.let { gf -> runLocalGguf(gf, fullSys, history, userMsg)?.let { return it } }~B~nAiResidentManager.gemmaLlm?.let { llm -> runCatching { llm.generateResponse(combP)?.trim()?.takeIf { it.isNotEmpty() } }?.getOrNull()?.let { lastEngineUsed = `🧠 로컬 LiteRT`; return cleanThink(it) } }",
          "var rawU = apiUrl.trim(); val k = apiKey.trim(); val m = apiModel.trim()~B~nif (rawU.isBlank() || rawU == `local_gguf`) return fallbackLlmOrChat(sysPrompt, ragCtx, history, userMsg)~B~nif (!rawU.startsWith(`http` + `://`) && !rawU.startsWith(`https` + `://`)) rawU = `http` + `://$rawU`~B~nval cleanU = rawU.removeSuffix(`/`)",
          "val base = cleanU.removeSuffix(`/v1/chat/completions`).removeSuffix(`/chat/completions`).removeSuffix(`/v1/completions`).removeSuffix(`/completions`).removeSuffix(`/completion`).removeSuffix(`/api/chat`).removeSuffix(`/api/generate`).removeSuffix(`/v1`).removeSuffix(`/`)~B~nval discMod = discoverServerModel(base, k)",
          "val mods = listOfNotNull(discMod.takeIf { it.isNotEmpty() }, m.takeIf { it.isNotEmpty() }, AiResidentManager.gemmaName.takeIf { it.isNotBlank() && !it.contains(`미연결`) }, `gemma3:1b`, ``).distinct()~B~nfor (ep in linkedSetOf(`$base/api/chat`, `$base/v1/chat/completions`, cleanU)) {~B~nfor (mod in mods) {",
          "val b = JSONObject().apply { if (mod.isNotEmpty()) put(`model`, mod); put(`stream`, false); put(`messages`, JSONArray().put(JSONObject().put(`role`, `system`).put(`content`, fullSys)).put(JSONObject().put(`role`, `user`).put(`content`, userMsg))) }~B~nval (c1, r1) = postApi(ep, k, b); parseAns(r1)?.let { lastEngineUsed = `🦙 Ollama/API`; return it }; if (c1 == -1) break~B~n}~B~n}~B~nreturn fallbackLlmOrChat(sysPrompt, ragCtx, history, userMsg)~B~n}"
          ])
          idx_h = min(x for x in [t.find("fun parseAns("), t.find("fun cleanThink("), t.find("fun callLlmHttp(")] if x != -1)
          idx_b = t.find("suspend fun buildAiChatReply(")
          t = t[:idx_h] + new_http + "~B~n~B~n" + t[idx_b:]
          t = t.replace("val useRag = aiCfg.ragOn || (q.contains(`내 메모`) || q.contains(`전체 메모`))", "val useRag = aiCfg.ragOn")
          t = re.sub(r"callLlmHttp~B~(aiCfg~B~.sysPrompt, ragContext, history, q~B~)~B~?~B~.let ~B~{[^~B~n]*~B~}", "callLlmHttp(aiCfg.sysPrompt, ragContext, history, q, aiCfg.apiUrl, aiCfg.apiModel, aiCfg.apiKey)?.let { return@withContext it }", t)
          t = re.sub(r"if ~B~(!useRag~B~) return@withContext `🔴.*", "if (!useRag) return@withContext fallbackLlmOrChat(aiCfg.sysPrompt, ragContext, history, q)", t)
          open(kf, "w").write(t)
          """.replace("~B~", chr(92)).replace("`", chr(92) + chr(34)).splitlines()))'
      - name: Upgrade v9.0 UI
        run: |
          python3 -c 'exec(chr(10).join(x.strip() for x in """
          import os, re
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"; t = open(kf).read()
          panel_s = "~B~n".join([
          "Column(Modifier.verticalScroll(rememberScrollState()).padding(ui.cardPad), verticalArrangement = Arrangement.spacedBy(6.dp)) {~B~nText(`🤖 1. 오프라인 단독 GGUF & 임베딩 (` + AiResidentManager.gemmaName.take(22) + ` / ` + AiResidentManager.embedName.take(18) + `)`, fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)~B~nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {",
          "ChipBtn(`📂 로컬 AI (GGUF) 올리기`, AiResidentManager.gemmaMb > 0L, CG) { if (!busy) gemmaPicker.launch(arrayOf(`*/*`)) }~B~nChipBtn(`📂 임베딩 모델 올리기`, AiResidentManager.embedMb > 0L, CG) { if (!busy) embedPicker.launch(arrayOf(`*/*`)) }~B~nChipBtn(`🗑️ 모델/저장소 비우기`, false, Color(0xFFEF4444)) { testReport = AiResidentManager.clearStorage(ctx) }~B~n}~B~ntestReport?.let { rep -> Text(rep, fontSize = ui.subSp, color = CG) }",
          "Text(`🦙 2. 작동 모드 & 로컬AI·RAG 상태 검증`, fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)~B~nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {~B~nChipBtn(`🧠 오프라인 단독 GGUF (내장 엔진)`, aiCfg.apiUrl == `local_gguf` || aiCfg.apiUrl.isBlank(), CG) { val u = aiCfg.copy(apiUrl = `local_gguf`); onUpdate(u); saveAiCfg(ctx, u); testReport = `✅ 내장 GGUF 오프라인 단독 모드 설정됨` }",
