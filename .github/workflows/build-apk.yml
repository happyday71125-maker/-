          _b += ['} else if (wlI?.isHeld == true) wlI?.release()', 'Unit', '}', 'fun flushV(ctx: Context) {', 'val msg = vBuf.trim(); vBuf = ""; vSpkNow = false; vSeq++', 'if (msg.isNotEmpty() && !isAiBusy && !streamActive && ttsI?.isSpeaking != true) {', 'runCatching { sttI?.cancel() }; isAiBusy = true; vSt = "🧠 " + msg.take(12); vCb(msg)', '}', '}']
