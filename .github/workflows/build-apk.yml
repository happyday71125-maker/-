"P_27": "fun releaseGguf() { if (ProLlamaJni.ready) runCatching { ProLlamaJni.abortGeneration() }; val p = ggufModelPtr; ggufModelPtr = 0L; ggufLoadedPath = ZqZq; if (p != 0L && ProLlamaJni.ready) runCatching { ProLlamaJni.freeModel(p) } }Zbnfun releaseEmbedGguf() { val p = embModelPtr; embModelPtr = 0L; embLoadedPath = ZqZq; if (p != 0L && ProLlamaJni.ready) runCatching { ProLlamaJni.freeModel(p) } }Zbnfun releaseAllLocalModels() { releaseGguf(); releaseEmbedGguf(); embedVecCache.clear() }Zbnfun normVec(v: FloatArray): FloatArray { var s = 0f; for (x in v) s += x * x; val n = kotlin.math.sqrt(s).coerceAtLeast(1e-6f); return FloatArray(v.size) { i -> v[i] / n } }Zbnfun dotCos(a: FloatArray, b: FloatArray): Float { val n = minOf(a.size, b.size); if (n == 0) return 0f; var d = 0f; for (i in 0 until n) d += a[i] * b[i]; return d.coerceIn(-1f, 1f) }Zbnsuspend fun embedWithGguf(rawText: String, isQuery: Boolean, docTitle: String = Zq메모Zq): FloatArray? { if (!ProLlamaJni.ready) return null; val ef = findEmbedGguf() ?: return null; val clean = rawText.replace(ZqZbbnZq, Zq Zq).trim().take(if (isQuery) 320 else 480); if (clean.isEmpty()) return null; val formatted = if (isQuery) Zqtask: search result | query: $cleanZq else Zqtitle: ${docTitle.ifBlank { ZqnoneZq }} | text: $cleanZq; val cKey = Zq${ef.name}_${ef.length()}_${isQuery}_${formatted.hashCode()}Zq; embedVecCache[cKey]?.let { return it }; llmMutex.lock(); try { return runCatching { val path = ef.absolutePath; if (embModelPtr == 0L || embLoadedPath != path) { releaseEmbedGguf(); val ptr = ProLlamaJni.loadModelBytes(path.toByteArray(Charsets.UTF_8)); if (ptr == 0L) return@runCatching null; embModelPtr = ptr; embLoadedPath = path; AiResidentManager.embedName = ef.name; AiResidentManager.embedMb = ef.length() / 1048576L }; val rawV = ProLlamaJni.embedTextBytes(embModelPtr, formatted.toByteArray(Charsets.UTF_8), optThreads()); if (rawV != null && rawV.isNotEmpty()) { val nv = normVec(rawV); if (embedVecCache.size > 512) e