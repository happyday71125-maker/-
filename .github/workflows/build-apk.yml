name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: prolauncher-ai-permanent-keystore-v1 }
      - name: Upgrade v8.6
        run: |
          python3 -c 'exec("\n".join(x.strip() for x in r"""
          import os, shutil, re
          kp = os.path.expanduser("~/.android/debug.keystore")
          if os.path.exists(kp): shutil.copy(kp, "app/fixed.keystore")
          kf = "app/src/main/java/app/prolauncher/ai/KoreanChosungMatcher.kt"
          p = open(kf).read().split("import android.app.*")
          cand = (p[-1] if "readerFontSp" in p[-1] else p[1]).replace("package app.prolauncher.ai", "")
          kept = (p[0] + "import android.app.*" + cand).replace(".setPreferredBackend(LlmInference.Backend.GPU)", "").replace(".setPreferredBackend(LlmInference.Backend.CPU)", "").splitlines()
          oc, cc = sum(x.count("{") for x in kept), sum(x.count("}") for x in kept)
          while cc > oc and kept and kept[-1].strip() == "}": kept.pop(); cc -= 1
          t = "\n".join(kept) + ("\n}" * max(0, oc - cc))
          t = t.replace("fun startService(ctx: Context) = runCatching {", "fun clearStorage(ctx: Context): String { runCatching { gemmaLlm?.close(); embedder?.close() }; gemmaLlm = null; gemmaBuf = null; embedder = null; embedBuf = null; gemmaMb = 0L; embedMb = 0L; embedName = \"미연결(기본임베딩)\"; var b = 0L; listOf(\"models\", \"llm_models\").forEach { d -> File(ctx.applicationContext.filesDir, d).listFiles()?.forEach { b += it.length(); it.delete() } }; prefs(ctx).edit().clear().apply(); uiTick++; return \"🗑️ 임베딩 모델 해제 및 저장소 비우기 완료 (${b/1048576L}MB 확보)\" }\nfun startService(ctx: Context) = runCatching { if (true) return@runCatching;")
          t = t.replace("val uiScale: String = \"AUTO\")", "val uiScale: String = \"AUTO\", val apiUrl: String = \"http\"+\"://127.0.0.1:11434\", val apiModel: String = \"\", val apiKey: String = \"\", val temp: Float = 0.5f)")
          t = t.replace("p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\")", "p.getString(\"ui_scale_mode\", \"AUTO\") ?: \"AUTO\", p.getString(\"ai_host_url\", \"http\"+\"://127.0.0.1:11434\") ?: \"http\"+\"://127.0.0.1:11434\", p.getString(\"ai_host_model\", \"\") ?: \"\", p.getString(\"ai_host_key\", \"\") ?: \"\", p.getFloat(\"ai_temp\", 0.5f))")
          t = t.replace(".putString(\"ui_scale_mode\", c.uiScale).apply()", ".putString(\"ui_scale_mode\", c.uiScale).putString(\"ai_host_url\", c.apiUrl.trim()).putString(\"ai_host_model\", c.apiModel.trim()).putString(\"ai_host_key\", c.apiKey.trim()).putFloat(\"ai_temp\", c.temp).apply()")
          t = t.replace("ProLauncherAI/7.0", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0.0.0 Mobile Safari/537.36")
          t = t.replace("URLEncoder.encode(\"$fullSys\\n질문: $userMsg\", \"UTF-8\")", "\"prompt/\" + URLEncoder.encode(userMsg.replace(\"\\n\", \" \"), \"UTF-8\") + \"?model=openai\"")
          t = t.replace("fun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String): String? {", "fun parseAns(r: String): String? = r.trim().takeIf { it.isNotEmpty() && !it.startsWith(\"<\") }?.let { s -> if (!s.startsWith(\"\\u007B\")) s else runCatching { val o = JSONObject(s); o.optJSONArray(\"choices\")?.optJSONObject(0)?.let { c -> c.optJSONObject(\"message\")?.optString(\"content\") ?: c.optString(\"text\") } ?: o.optJSONObject(\"message\")?.optString(\"content\") ?: o.optString(\"response\") ?: o.optString(\"content\") }.getOrNull()?.trim()?.takeIf { it.isNotBlank() } }\nfun findModel(base: String): String? = listOf(\"$base/v1/models\", \"$base/api/tags\", \"$base/models\").firstNotNullOfOrNull { ep -> runCatching { val c = (URL(ep).openConnection() as HttpURLConnection).apply { connectTimeout = 2000; readTimeout = 3000 }; if (c.responseCode in 200..299) { val o = JSONObject(c.inputStream.bufferedReader().readText()); o.optJSONArray(\"data\")?.optJSONObject(0)?.optString(\"id\")?.takeIf { it.isNotBlank() } ?: o.optJSONArray(\"models\")?.optJSONObject(0)?.let { it.optString(\"name\").ifBlank { it.optString(\"model\") } }?.takeIf { it.isNotBlank() } } else null }.getOrNull() }\nfun wikiSearch(qRaw: String): String? = runCatching {\nval cleaned = qRaw.replace(Regex(\"(에 대해|에 관해|알려줘|설명해줘|무엇인가요|어떤나라야|어떤 나라야|뭐야|이란|란|으로|로|에서|에게|을|를|은|는|이|가|의|에)(?=\\\\s|$)\"), \" \").replace(Regex(\"[?？.!:]+\"), \" \").trim()\nval words = cleaned.split(Regex(\"\\\\s+\")).filter { it.isNotBlank() }; val kw = words.firstOrNull() ?: qRaw.trim(); val ua = \"Mozilla/5.0\"\nfor (cand in listOf(cleaned, kw, words.lastOrNull() ?: kw).distinct()) { val c1 = (URL(\"https\"+\"://ko.wikipedia.org/api/rest_v1/page/summary/${URLEncoder.encode(cand, \"UTF-8\")}\").openConnection() as HttpURLConnection).apply { connectTimeout = 4000; readTimeout = 7000; setRequestProperty(\"User-Agent\", ua) }; if (c1.responseCode in 200..299) { val ex = JSONObject(c1.inputStream.bufferedReader().readText()).optString(\"extract\"); if (ex.isNotBlank()) return@runCatching \"📚 [위키백과: $cand]\\n$ex\" } }\nval sc = (URL(\"https\"+\"://ko.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${URLEncoder.encode(cleaned.ifBlank { qRaw }, \"UTF-8\")}&gsrlimit=2&prop=extracts&exintro=1&explaintext=1&format=json\").openConnection() as HttpURLConnection).apply { connectTimeout = 5000; readTimeout = 8000; setRequestProperty(\"User-Agent\", ua) }\nif (sc.responseCode in 200..299) { val pages = JSONObject(sc.inputStream.bufferedReader().readText()).optJSONObject(\"query\")?.optJSONObject(\"pages\"); if (pages != null) { val keys = pages.keys(); val sb = StringBuilder(); while (keys.hasNext()) { val pObj = pages.optJSONObject(keys.next()); val ex = pObj?.optString(\"extract\")?.trim() ?: \"\"; if (ex.isNotBlank()) sb.append(\"📚 [${pObj.optString(\"title\")}]\\n${ex.take(500)}\\n\\n\") }; if (sb.isNotEmpty()) return@runCatching sb.toString().trim() } }\nnull\n}.getOrNull()\nfun callLlmHttp(sysPrompt: String, ragCtx: String, history: List<ChatMsg>, userMsg: String, apiUrl: String = \"\", apiModel: String = \"\", apiKey: String = \"\", temp: Float = 0.5f): String? {\nval rawUrl = if (apiUrl.isNotBlank()) apiUrl.trim().trimEnd('/') else if (apiKey.trim().startsWith(\"AIza\")) \"https\"+\"://generativelanguage.googleapis.com/v1beta/openai/chat/completions\" else if (apiKey.trim().startsWith(\"gsk_\")) \"https\"+\"://api.groq.com/openai/v1/chat/completions\" else if (apiKey.trim().startsWith(\"sk-or-\")) \"https\"+\"://openrouter.ai/api/v1/chat/completions\" else if (apiKey.trim().startsWith(\"sk-\")) \"https\"+\"://api.openai.com/v1/chat/completions\" else \"\"\nval fullSys0 = if (ragCtx.isBlank()) sysPrompt else \"$sysPrompt\\n\\n[참고 메모]\\n$ragCtx\"\nval combP = if (fullSys0.isBlank()) userMsg else \"$fullSys0\\n\\n질문: $userMsg\"\nif (rawUrl.isNotBlank()) {\nval base = rawUrl.removeSuffix(\"/v1/chat/completions\").removeSuffix(\"/api/chat\").removeSuffix(\"/api/generate\").removeSuffix(\"/v1/completions\").removeSuffix(\"/completion\").removeSuffix(\"/v1\").trimEnd('/')\nval discMod = findModel(base)\nval mods = listOfNotNull(discMod, apiModel.trim().takeIf { it.isNotBlank() }, if (apiModel.isNotBlank() && !apiModel.endsWith(\".gguf\")) apiModel.trim() + \".gguf\" else null, \"default\", \"\").distinct()\nval eps = (if (rawUrl != base) listOf(rawUrl) else emptyList()) + listOf(\"$base/v1/chat/completions\", \"$base/api/chat\")\nvar lastErr = \"\"\nfor (ep in eps.distinct()) for (mod in mods) for (sysRole in listOf(false, true)) {\nval out = runCatching {\nval c = (URL(ep).openConnection() as HttpURLConnection).apply { requestMethod = \"POST\"; connectTimeout = 5000; readTimeout = 30000; doOutput = true; setRequestProperty(\"Content-Type\", \"application/json; charset=UTF-8\"); if (apiKey.isNotBlank()) setRequestProperty(\"Authorization\", \"Bearer ${apiKey.trim()}\") }\nval ms = JSONArray().apply { if (sysRole) { put(JSONObject().put(\"role\", \"system\").put(\"content\", fullSys0)); put(JSONObject().put(\"role\", \"user\").put(\"content\", userMsg)) } else put(JSONObject().put(\"role\", \"user\").put(\"content\", combP)) }\nval b = JSONObject().put(\"messages\", ms).put(\"stream\", false).put(\"temperature\", temp.toDouble()).apply { if (mod.isNotEmpty()) put(\"model\", mod) }\nOutputStreamWriter(c.outputStream, Charsets.UTF_8).use { it.write(b.toString()) }\nif (c.responseCode in 200..299) parseAns(c.inputStream.bufferedReader().readText()) else { val es = runCatching { c.errorStream?.bufferedReader()?.readText()?.take(160) }.getOrNull() ?: \"\"; lastErr = \"HTTP ${c.responseCode} ($ep | model=${mod.ifEmpty { \"자동\" }}) $es\"; null }\n}.getOrElse { lastErr = \"${it.javaClass.simpleName}: ${it.message}\"; null }\nif (!out.isNullOrBlank()) return out\n}\nfor (ep in listOf(\"$base/completion\", \"$base/v1/completions\", \"$base/api/generate\")) {\nval out = runCatching {\nval c = (URL(ep).openConnection() as HttpURLConnection).apply { requestMethod = \"POST\"; connectTimeout = 4000; readTimeout = 25000; doOutput = true; setRequestProperty(\"Content-Type\", \"application/json; charset=UTF-8\") }\nval m0 = discMod ?: apiModel.trim()\nval b = JSONObject().put(\"prompt\", combP).put(\"stream\", false).put(\"n_predict\", 512).apply { if (m0.isNotEmpty()) put(\"model\", m0) }\nOutputStreamWriter(c.outputStream, Charsets.UTF_8).use { it.write(b.toString()) }\nif (c.responseCode in 200..299) parseAns(c.inputStream.bufferedReader().readText()) else null\n}.getOrNull()\nif (!out.isNullOrBlank()) return out\n}\nreturn \"⚠️ 로컬/호스팅 API 응답 오류:\\n• 상세: $lastErr\\n• 서버 감지 모델: ${discMod ?: \"미감지 (Llama API 서버 앱에서 모델이 로드/실행 중인지 확인해 주세요)\"}\"\n}")
          t = t.replace("if (!post.isNullOrBlank()) return post", "if (!post.isNullOrBlank()) parseAns(post)?.let { return it }")
          t = t.replace("}.getOrNull()\n}", "}.getOrNull()?.let { parseAns(it) } ?: wikiSearch(userMsg)\n}")
          t = t.replace("callLlmHttp(aiCfg.sysPrompt, ragContext, history, q)?.let { return@withContext \"☁️ [온라인 LLM 응답 (Gemma 3 1B 파일 미연결 상태)${if (useRag) \" + 임베딩젬마2 RAG\" else \"\"}]\\n$it\" }", "callLlmHttp(aiCfg.sysPrompt, ragContext, history, q, aiCfg.apiUrl, aiCfg.apiModel, aiCfg.apiKey, aiCfg.temp)?.let { return@withContext it }")
          t = re.sub(r"if \(!useRag\) return@withContext \"🔴.*", "if (!useRag) return@withContext \"⚠️ 검색 결과를 찾지 못했습니다. [⚙️ AI 설정]에서 API 호스팅 서버 상태를 확인해 주세요.\"", t)
          t = re.sub(r"Column\(Modifier\.verticalScroll.*?Text\(\"⚙️ 2\. 기본 프롬프트 수정 & 프리셋\"", "Column(Modifier.verticalScroll(rememberScrollState()).padding(ui.cardPad), verticalArrangement = Arrangement.spacedBy(6.dp)) {\nText(\"🌐 1. AI API 호스팅 설정\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG)\nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nChipBtn(\"🦙 로컬 Llama서버(11434 자동감지)\", aiCfg.apiUrl.contains(\"11434\"), CG) { scope.launch(Dispatchers.IO) { val dm = findModel(\"http\"+\"://127.0.0.1:11434\") ?: \"\"; withContext(Dispatchers.Main) { val u = aiCfg.copy(apiUrl = \"http\"+\"://127.0.0.1:11434\", apiModel = dm); onUpdate(u); saveAiCfg(ctx, u); testReport = if (dm.isNotBlank()) \"✅ 로컬 서버 모델 자동 감지됨: $dm\" else \"ℹ️ 주소 설정됨 (http\"+\"://127.0.0.1:11434) — 채팅 전송 시 엔드포인트(/v1/chat/completions, /api/chat, /completion)와 모델명을 자동 탐색합니다.\" } } }\nlistOf(\"✨ Gemini\" to (\"https\"+\"://generativelanguage.googleapis.com/v1beta/openai/chat/completions\" to \"gemini-2.5-flash\"), \"⚡ Groq\" to (\"https\"+\"://api.groq.com/openai/v1/chat/completions\" to \"llama-3.3-70b-versatile\"), \"🌐 OpenRouter\" to (\"https\"+\"://openrouter.ai/api/v1/chat/completions\" to \"google/gemma-3-27b-it:free\"), \"📚 위키검색\" to (\"\" to \"\")).forEach { (l, p) -> ChipBtn(l, aiCfg.apiUrl == p.first && !p.first.contains(\"11434\"), CG) { val u = aiCfg.copy(apiUrl = p.first, apiModel = p.second); onUpdate(u); saveAiCfg(ctx, u) } }\n}\nOutlinedTextField(value = aiCfg.apiUrl, onValueChange = { val u = aiCfg.copy(apiUrl = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"API 호스팅 URL (예: http\"+\"://127.0.0.1:11434)\") }, singleLine = true, modifier = Modifier.fillMaxWidth())\nRow(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nOutlinedTextField(value = aiCfg.apiModel, onValueChange = { val u = aiCfg.copy(apiModel = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"모델명 (비워두면 서버 자동감지)\") }, singleLine = true, modifier = Modifier.weight(1f))\nOutlinedTextField(value = aiCfg.apiKey, onValueChange = { val u = aiCfg.copy(apiKey = it); onUpdate(u); saveAiCfg(ctx, u) }, label = { Text(\"API Key (로컬서버는 비워둠)\") }, singleLine = true, modifier = Modifier.weight(1f))\n}\nRow(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\nChipBtn(\"📂 임베딩 모델 올리기\", AiResidentManager.embedder != null || AiResidentManager.embedBuf != null, CG) { if (!busy) embedPicker.launch(arrayOf(\"*/*\")) }\nChipBtn(\"🗑️ 임베딩 모델 비우기\", false, Color(0xFFEF4444)) { testReport = AiResidentManager.clearStorage(ctx) }\n}\ntestReport?.let { rep -> Text(rep, fontSize = ui.subSp, color = CG) }\nRow(Modifier.fillMaxWidth(), SB, CV) {\nText(\"⚙️ 2. 기본 프롬프트 수정 & 프리셋\"", t, flags=re.S)
          open(kf, "w").write(t)
          mf = "app/src/main/AndroidManifest.xml"; m = open(mf).read()
          for pm in ["FOREGROUND_SERVICE", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"]: m = m if pm in m else m.replace("<application", f"<uses-permission android:name=\"android.permission.{pm}\" />\n<application", 1)
          if "largeHeap" not in m: m = m.replace("<application", "<application android:largeHeap=\"true\"", 1)
          if "AiResidentService" not in m: m = m.replace("</application>", "<service android:name=\".AiResidentService\" android:exported=\"false\" /></application>", 1)
          open(mf, "w").write(m.replace("singleTask", "singleTop"))
          gf = "app/build.gradle.kts"; g = open(gf).read().replace("0.10.14", "0.10.21").replace("0.10.22", "0.10.21")
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 5${{ github.run_number }}", g)
          if os.path.exists("app/fixed.keystore") and "fixed.keystore" not in g: g = g.replace("buildFeatures {", "signingConfigs { getByName(\"debug\") { storeFile = file(\"fixed.keystore\") } }\nbuildFeatures {", 1)
          open(gf, "w").write(g)
          sf = "app/src/main/java/app/prolauncher/ai/Screens.kt"; s = open(sf).read()
          s = s.replace("✨ AI 챗봇 (LLM & 전체 메모 RAG)", "✨ AI 챗봇").replace("✅ LLM 챗봇 + 전체 메모 RAG 엔진 활성", "🌐 API 호스팅 챗봇 · 임베딩 RAG").replace("⚙️ 프롬프트·RAG 설정", "⚙️ AI 설정").replace("⚙️ 카테고리·배율 설정", "⚙️ 메모 설정"); s = re.sub(r"ChipBtn\(\"💬 일반 AI 질문\".*?aiPromptCfgOpen = !aiPromptCfgOpen \}", "", s, flags=re.S)
          s = s.replace("val picker =", "val bkExp = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument(\"application/json\")) { u -> if (u != null) runCatching { val j = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).getString(\"notes_json\", \"[]\") ?: \"[]\"; ctx.contentResolver.openOutputStream(u)?.use { it.write(j.toByteArray()) }; aiMsg = \"💾 메모 파일 백업 완료 (${notes.size}건)\" } }\nval bkImp = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u -> if (u != null) runCatching { val j = ctx.contentResolver.openInputStream(u)?.bufferedReader()?.use { it.readText() } ?: \"\"; if (j.trim().startsWith(\"[\")) { val old = notes; ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).edit().putString(\"notes_json\", j).commit(); val merged = (repo.loadNotes() + old).distinctBy { it.id }; onSaveNotes(merged); aiMsg = \"♻️ 메모 복원 완료 (총 ${merged.size}건)\" } } }\nval picker =")
          s = s.replace("Text(\"3. 기능버튼 표시 설정\"", "Text(\"💾 메모 백업 & 복원\", fontSize = (ui.subSp.value + 1).sp, fontWeight = FontWeight.Bold, color = CG); Row(FMW.horizontalScroll(rememberScrollState()), horizontalArrangement = HS6) { ChipBtn(\"💾 파일 백업\", false, CG) { bkExp.launch(\"prolauncher_memos_backup.json\") }; ChipBtn(\"📂 파일 복원\", false, CA) { bkImp.launch(arrayOf(\"*/*\")) }; ChipBtn(\"⚡ 즉시 백업\", false, CG) { val j = ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).getString(\"notes_json\", \"[]\") ?: \"[]\"; ctx.getSharedPreferences(\"pl_ai_v4_custom\", 0).edit().putString(\"memo_backup_json\", j).apply(); aiMsg = \"✅ 메모 ${notes.size}건 즉시 백업 완료!\" }; ChipBtn(\"♻️ 즉시 복원\", false, CA) { val j = ctx.getSharedPreferences(\"pl_ai_v4_custom\", 0).getString(\"memo_backup_json\", null); if (!j.isNullOrBlank()) { val old = notes; ctx.getSharedPreferences(\"pl_ai_v2_prefs\", 0).edit().putString(\"notes_json\", j).commit(); val merged = (repo.loadNotes() + old).distinctBy { it.id }; onSaveNotes(merged); aiMsg = \"✅ 메모 ${merged.size}건 복원 완료!\" } } }; Text(\"3. 기능버튼 표시 설정\"")
          open(sf, "w").write(s)
          for fn in ["KoreanChosungMatcher.kt", "ModelBundleManager.kt", "Screens.kt"]: fp = "app/src/main/java/app/prolauncher/ai/" + fn; c = open(fp).read(); open(fp, "w").write(re.sub(r"ui\.(subSp|bodySp|titleSp)\s*\+\s*(\d+)\.sp", r"(ui.\g<1>.value + \g<2>).sp", c))
          """.splitlines()))'
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ProLauncherAI-debug-apk, path: "app/build/outputs/apk/debug/*.apk" }
